title: "Compléter des égalités du type 1 200 = 1,2 × …"
speech: 1
keys: ["_","_","_","_","_","_","_","_"]
description: "Retrouver le multiplicateur (10, 100 ou 1000) manquant dans une égalité"
dest: ["6NE", "5NC", "4NC", "3NB"]
options:
  - name: "1 chiffre significatif, multiplicateur 10"
    vars:
      a: "1_9"
      p: "-3_3"
      c: "${MMmath.round(:a*Math.pow(10,:p),3)}"
      prod: "${MMmath.round(:c*10,6)}"
    question: ":prod=:c\\times\\, ?"
    shortq: ":prod=:c\\times\\colorbox{#ececec}{\\quad}"
    audio: "${String(:prod).replace('.',',')} égale ${String(:c).replace('.',',')} fois combien ?"
    answer: ":prod=:c\\times\\color{red}{10}"
    value: 10
