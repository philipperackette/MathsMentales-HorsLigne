vars:
  # cas : 0 quelconque, 1 rectangle, 2 isocèle, 3 équilatéral — tiré à chaque
  # question, dans les quatre options (aucune n'est réservée à une nature)
  cas: [0, 1, 2, 3]
  # deux : 0 = trois mesures données, 1 = deux mesures données (celle qui
  # permettrait de conclure directement est masquée) — fixé par l'option
  deux: 0

  # ── quelconque : deux mesures tirées, la troisième s'en déduit. qA reste
  # assez petit pour que qB puis qC (=180-qA-qB) soient toujours strictement
  # croissants : qA<qB<qC, donc les trois valeurs restent distinctes et qC,
  # toujours ≥91, ne tombe jamais sur 90°.
  qA: "25_44"
  qB: "${:qA+1}_${89-:qA}"
  qC: "${180-:qA-:qB}"

  # ── rectangle : angle droit fixe, les deux angles aigus sont distincts
  # (jamais 45°/45°, qui ferait aussi un triangle isocèle)
  rM: "10_80_^45"
  rN: "${90-:rM}"

  # ── isocèle : sommet d'un nombre pair de degrés pour que la base tombe
  # juste ; exclu 30 (équilatéral, 60-60-60) et 45 (rectangle isocèle, 90-45-45)
  iSommetDemi: "10_65_^30,45"
  iSommet: "${2*:iSommetDemi}"
  iBase: "${(180-:iSommet)/2}"

  # ── position du sommet « particulier » (le plus grand angle pour le
  # quelconque, l'angle droit pour le rectangle, le sommet pour l'isocèle ;
  # sans effet pour l'équilatéral) et ordre des deux autres mesures
  role: [0, 1, 2]
  swap: [0, 1]
  special: "${:cas===0?:qC:(:cas===1?90:(:cas===2?:iSommet:60))}"
  reste1: "${:cas===0?(:swap?:qB::qA):(:cas===1?(:swap?:rN::rM):(:cas===2?:iBase:60))}"
  reste2: "${:cas===0?(:swap?:qA::qB):(:cas===1?(:swap?:rM::rN):(:cas===2?:iBase:60))}"
  angleA: "${:role===0?:special::reste1}"
  angleB: "${:role===1?:special:(:role===0?:reste1::reste2)}"
  angleC: "${:role===2?:special::reste2}"

  # ── mesure masquée dans la variante à deux mesures : toujours celle qui
  # permettrait de conclure directement (l'angle droit pour le rectangle, un
  # des deux angles égaux pour l'isocèle ; n'importe laquelle sinon, puisque
  # rien ne se lit sur un seul angle)
  cacheChoix: [0, 1]
  cacheIso: "${:cacheChoix ? (:role+2)%3 : (:role+1)%3}"
  cacheLibre: [0, 1, 2]
  hidden: "${:cas===1?:role:(:cas===2?:cacheIso::cacheLibre)}"
  label1: "${:hidden===0?'B':'A'}"
  value1: "${:hidden===0?:angleB::angleA}"
  label2: "${:hidden===2?'B':'C'}"
  value2: "${:hidden===2?:angleB::angleC}"
  labelHidden: "${:hidden===0?'A':(:hidden===1?'B':'C')}"
  hiddenValue: "${:hidden===0?:angleA:(:hidden===1?:angleB::angleC)}"
  autreSum: "${180-:hiddenValue}"

  natureMot: "${:cas===0?'quelconque':(:cas===1?'rectangle':(:cas===2?'isocèle':'équilatéral'))}"
  raison: "${:cas===0?'aucun angle ne mesure 90°, aucun n’est répété':(:cas===1?'un angle mesure 90°':(:cas===2?'deux angles mesurent '+:iBase+'°':'les trois angles mesurent 60°'))}"

  # ── mesures écrites sur la figure (options 1 et 2 seulement) : la valeur,
  # ou rien pour celle qui manque quand deux vaut 1 (même angle que celui
  # masqué dans le texte) : un « ? » surchargeait le dessin, déjà chargé
  markA: "${(:deux && :hidden===0) ? '' : :angleA+'°'}"
  markB: "${(:deux && :hidden===1) ? '' : :angleB+'°'}"
  markC: "${(:deux && :hidden===2) ? '' : :angleC+'°'}"
  # arc de codage sur les angles connus : pas de trait (couleur "none") sur
  # celui qui manque
  arcA: "${(:deux && :hidden===0) ? 'none' : '#118ab2'}"
  arcB: "${(:deux && :hidden===1) ? 'none' : '#118ab2'}"
  arcC: "${(:deux && :hidden===2) ? 'none' : '#118ab2'}"

  numfig: "0_4"
  fig: "${:figs[:cas][:numfig].replaceAll('%AV%',:markA).replaceAll('%BV%',:markB).replaceAll('%CV%',:markC).replaceAll('%AA%',:arcA).replaceAll('%BA%',:arcB).replaceAll('%CA%',:arcC)}"
question: "${:quest[:deux]}"
answer: "${:rep[:deux]}"
value: "${:natureMot}"
options:
  # avec figure : les mesures sont déjà écrites sur le dessin (marques
  # %AV%/%BV%/%CV%), donc pas besoin de les répéter dans l'énoncé — la
  # consigne seule (« Quelle est la nature du triangle ABC ? ») suffit
  - name: Trois mesures, avec figure
    vars:
      deux: 0
    question: ""
    figure:
      type: svg
      content: "${:fig}"
  - name: Deux mesures, avec figure
    vars:
      deux: 1
    question: ""
    figure:
      type: svg
      content: "${:fig}"
  - name: Trois mesures, sans figure
    vars:
      deux: 0
  - name: Deux mesures, sans figure
    vars:
      deux: 1
