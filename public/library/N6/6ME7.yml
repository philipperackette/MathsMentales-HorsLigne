title: Reconnaître la nature d'un triangle à partir de la mesure de ses angles
description: "nature d'un triangle, angles, isocèle, équilatéral, rectangle, somme des angles 180°"
dest:
  - 6ME
  - 5GB
  - 4GB
  - 3GB
type: text
# l'équilatéral n'a qu'une seule mesure possible (60-60-60, seule
# l'illustration varie) : sans repeat, la déduplication stricte sur les 5
# dernières questions bloque son tirage
repeat: true
keys: ["qcq", "iso", "equi", "rect"]
consigne: "Quelle est la nature du triangle $$ABC$$ ?"
consts:
  # gabarits de question/réponse, indexés par :deux (0 = trois mesures données,
  # 1 = deux mesures données, la troisième se calculant par la somme des
  # angles). Les :varname sont substitués une fois ce gabarit récupéré par
  # ${:quest[:deux]} / ${:rep[:deux]}, quand les vars existent déjà.
  quest:
    - "Le triangle $$ABC$$ est tel que $$\\widehat{A}=:angleA°$$, $$\\widehat{B}=:angleB°$$ et $$\\widehat{C}=:angleC°$$."
    - "Le triangle $$ABC$$ est tel que $$\\widehat{:label1}=:value1°$$ et $$\\widehat{:label2}=:value2°$$."
  rep:
    - ":raison : le triangle $$ABC$$ est <span class='red'>:natureMot</span>."
    - "$$\\widehat{A}+\\widehat{B}+\\widehat{C}=180°$$ donc $$\\widehat{:labelHidden}=180°-:autreSum°=\\color{red}{:hiddenValue°}$$.<br>:raison : le triangle $$ABC$$ est <span class='red'>:natureMot</span>."
  # figs[cas][numéro] : cinq tracés à main levée par nature (0 quelconque,
  # 1 rectangle, 2 isocèle, 3 équilatéral), générés par tools/figures-6ME7.mjs.
  # Purement illustratifs pour la forme (non à l'échelle) : les sommets A, B, C
  # sont fixes, mais la mesure de chaque angle (marque %AV%/%BV%/%CV%) et l'arc
  # qui la code (marque %AA%/%BA%/%CA%, une couleur) restent à remplacer plus
  # bas par la vraie valeur — ou par rien pour la mesure qui manque.
  figs:
    # 0 — quelconque
