    - "<svg width='12em' height='11.04em' viewBox='0 0 200 184' xmlns='http://www.w3.org/2000/svg'><g fill='none' stroke-linecap='round' stroke-linejoin='round'><path d='M134.8 136.8 C137.5 123.8, 145.7 111, 155.1 73.7 M156 74.9 C136.7 83.9, 116.1 97.4, 56.3 129.6 M53.2 129 C74.4 129.9, 94.3 135.4, 134.8 139' stroke='#118ab2' stroke-width='2'/><path d='M133.6 135.6 C127.2 129.8, 118.7 124.7, 96.5 103.8' stroke='#c1121f' stroke-width='2'/></g><g font-size='14' fill='#118ab2' text-anchor='middle' dominant-baseline='central'><text x='144' y='147'>%A%</text><text x='164' y='65'>%B%</text><text x='42' y='131'>%C%</text><text x='81' y='101'>%M%</text></g></svg>"
