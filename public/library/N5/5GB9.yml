        - [point, ["${MMmath.round(:x2+:mA2x*0.66,4)}", "${MMmath.round(:y2+:mA2y*0.66,4)}"], { name: zCT1, visible: false, withLabel: false }]
        - [point, ["${MMmath.round(:x2+:mA2x*1.14,4)}", "${MMmath.round(:y2+:mA2y*1.14,4)}"], { name: zCT2, visible: false, withLabel: false }]
        - [segment, [zCT1, zCT2], { strokeColor: "#7b2cbf", strokeWidth: 1.2, visible: "${:codeBissectrice}" }]
        - [point, ["${MMmath.round(:x2+:mB2x*0.66,4)}", "${MMmath.round(:y2+:mB2y*0.66,4)}"], { name: zCT3, visible: false, withLabel: false }]
        - [point, ["${MMmath.round(:x2+:mB2x*1.14,4)}", "${MMmath.round(:y2+:mB2y*1.14,4)}"], { name: zCT4, visible: false, withLabel: false }]
        - [segment, [zCT3, zCT4], { strokeColor: "#7b2cbf", strokeWidth: 1.2, visible: "${:codeBissectrice}" }]
