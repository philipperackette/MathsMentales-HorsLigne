    - "<svg width='12em' height='11.04em' viewBox='0 0 200 184' xmlns='http://www.w3.org/2000/svg'><g fill='none' stroke-linecap='round' stroke-linejoin='round'><path d='M40.6 101.6 C59.7 107.2, 82.9 113.2, 134.7 137.9 M138.4 137.7 C133.6 103.9, 125.8 67.9, 122.6 37.9 M122.9 39.5 C100.3 53.7, 80.6 72, 42 102.4' stroke='#118ab2' stroke-width='2'/><path d='M43.7 100.5 C59.4 94.3, 75.8 88.2, 126 71.2' stroke='#c1121f' stroke-width='2'/></g><g font-size='14' fill='#118ab2' text-anchor='middle' dominant-baseline='central'><text x='30' y='103'>%A%</text><text x='144' y='147'>%B%</text><text x='125' y='26'>%C%</text><text x='139' y='63'>%M%</text></g></svg>"
