  # ───────────────── coder une figure à main levée
  - name: Coder une hauteur
    vars:
      cod: 1
    question: Sur cette figure à main levée, la droite $$(:nA:nD)$$ est une :codNom du triangle $$:nom$$.<br>Coder la figure.
    shortq: coder la figure ?
    answer: ${:cod===1?:repCodeHauteur::repCodeMediane}
    value: &valeursCodage
      - '${:cod===1?"angle droit":"milieu"}'
      - '${:cod===1?"un angle droit":"un milieu"}'
      - '${:cod===1?"l’angle droit":"le milieu"}'
      - '${:cod===1?"l''angle droit":"le milieu de ["+:nB+:nC+"]"}'
      - '${:cod===1?"angle droit en "+:nD:"milieu de ["+:nB+:nC+"]"}'
    figure: &figureCodage
      type: svg
      content: ${:fig}
  - name: Coder une médiane
