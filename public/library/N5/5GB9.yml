        - [angle, [zAQ2, zA1, zAQ3], { radius: 0.9, selection: minor, label: { visible: false }, strokeColor: "#7b2cbf", strokeWidth: 1.2, fillColor: "#ffd166", fillOpacity: 0.6, visible: "${:codeBissectrice}" }]
        - [point, ["${MMmath.round(:x0+:mA0x*0.66,4)}", "${MMmath.round(:y0+:mA0y*0.66,4)}"], { name: zAT1, visible: false, withLabel: false }]
        - [point, ["${MMmath.round(:x0+:mA0x*1.14,4)}", "${MMmath.round(:y0+:mA0y*1.14,4)}"], { name: zAT2, visible: false, withLabel: false }]
        - [segment, [zAT1, zAT2], { strokeColor: "#7b2cbf", strokeWidth: 1.2, visible: "${:codeBissectrice}" }]
        - [point, ["${MMmath.round(:x0+:mB0x*0.66,4)}", "${MMmath.round(:y0+:mB0y*0.66,4)}"], { name: zAT3, visible: false, withLabel: false }]
        - [point, ["${MMmath.round(:x0+:mB0x*1.14,4)}", "${MMmath.round(:y0+:mB0y*1.14,4)}"], { name: zAT4, visible: false, withLabel: false }]
        - [segment, [zAT3, zAT4], { strokeColor: "#7b2cbf", strokeWidth: 1.2, visible: "${:codeBissectrice}" }]
        # ─── droite du côté 1 et son codage
        - [point, ["${:o1x}", "${:o1y}"], { name: zB1, visible: false, withLabel: false }]
        - [point, ["${:n1x}", "${:n1y}"], { name: zB2, visible: false, withLabel: false }]
        - [line, [zB1, zB2], { strokeColor: "#c1121f", strokeWidth: 1.4 }]
        # angle droit entre la droite et le côté : sommet de l’angle, bras porté
        # par la droite, bras porté par le côté et tourné vers le milieu
        - [point, ["${:a1x}", "${:a1y}"], { name: zBD, visible: false, withLabel: false }]
        - [point, ["${MMmath.round(:a1x+(:e1?:v1x::w1*:u1x)*0.4,4)}", "${MMmath.round(:a1y+(:e1?:v1y::w1*:u1y)*0.4,4)}"], { name: zBE, visible: false, withLabel: false }]
        - [point, ["${MMmath.round(:a1x+(:e1?:w1*:u1x::v1x)*0.4,4)}", "${MMmath.round(:a1y+(:e1?:w1*:u1y::v1y)*0.4,4)}"], { name: zBF, visible: false, withLabel: false }]
        - [angle, [zBE, zBD, zBF], { radius: 0.28, label: { visible: false }, strokeColor: "#c1121f", strokeWidth: 1.2, fillColor: "#ffd166", fillOpacity: 0.6, visible: "${:codeAngle3}" }]
        # milieu du côté : une même marque au milieu de chaque demi-côté
        - [point, ["${MMmath.round((:x2+:m1x)/2+0.14*:v1x,4)}", "${MMmath.round((:y2+:m1y)/2+0.14*:v1y,4)}"], { name: zBG, visible: false, withLabel: false }]
        - [point, ["${MMmath.round((:x2+:m1x)/2-0.14*:v1x,4)}", "${MMmath.round((:y2+:m1y)/2-0.14*:v1y,4)}"], { name: zBH, visible: false, withLabel: false }]
        - [segment, [zBG, zBH], { strokeColor: "#7b2cbf", strokeWidth: 1.4, visible: "${:codeMilieu3}" }]
        - [point, ["${MMmath.round((:x0+:m1x)/2+0.14*:v1x,4)}", "${MMmath.round((:y0+:m1y)/2+0.14*:v1y,4)}"], { name: zBJ, visible: false, withLabel: false }]
        - [point, ["${MMmath.round((:x0+:m1x)/2-0.14*:v1x,4)}", "${MMmath.round((:y0+:m1y)/2-0.14*:v1y,4)}"], { name: zBK, visible: false, withLabel: false }]
        - [segment, [zBJ, zBK], { strokeColor: "#7b2cbf", strokeWidth: 1.4, visible: "${:codeMilieu3}" }]
        - [point, ["${MMmath.round(:x1+:p1x*1.1,4)}", "${MMmath.round(:y1+:p1y*1.1,4)}"], { name: zBQ1, visible: false, withLabel: false }]
        - [point, ["${MMmath.round(:x1+:db1x*1.1,4)}", "${MMmath.round(:y1+:db1y*1.1,4)}"], { name: zBQ2, visible: false, withLabel: false }]
        - [point, ["${MMmath.round(:x1+:q1x*1.1,4)}", "${MMmath.round(:y1+:q1y*1.1,4)}"], { name: zBQ3, visible: false, withLabel: false }]
        - [angle, [zBQ1, zB1, zBQ2], { radius: 0.9, selection: minor, label: { visible: false }, strokeColor: "#7b2cbf", strokeWidth: 1.2, fillColor: "#ffd166", fillOpacity: 0.6, visible: "${:codeBissectrice}" }]
        - [angle, [zBQ2, zB1, zBQ3], { radius: 0.9, selection: minor, label: { visible: false }, strokeColor: "#7b2cbf", strokeWidth: 1.2, fillColor: "#ffd166", fillOpacity: 0.6, visible: "${:codeBissectrice}" }]
        - [point, ["${MMmath.round(:x1+:mA1x*0.66,4)}", "${MMmath.round(:y1+:mA1y*0.66,4)}"], { name: zBT1, visible: false, withLabel: false }]
        - [point, ["${MMmath.round(:x1+:mA1x*1.14,4)}", "${MMmath.round(:y1+:mA1y*1.14,4)}"], { name: zBT2, visible: false, withLabel: false }]
        - [segment, [zBT1, zBT2], { strokeColor: "#7b2cbf", strokeWidth: 1.2, visible: "${:codeBissectrice}" }]
        - [point, ["${MMmath.round(:x1+:mB1x*0.66,4)}", "${MMmath.round(:y1+:mB1y*0.66,4)}"], { name: zBT3, visible: false, withLabel: false }]
        - [point, ["${MMmath.round(:x1+:mB1x*1.14,4)}", "${MMmath.round(:y1+:mB1y*1.14,4)}"], { name: zBT4, visible: false, withLabel: false }]
        - [segment, [zBT3, zBT4], { strokeColor: "#7b2cbf", strokeWidth: 1.2, visible: "${:codeBissectrice}" }]
        # ─── droite du côté 2 et son codage
        - [point, ["${:o2x}", "${:o2y}"], { name: zC1, visible: false, withLabel: false }]
        - [point, ["${:n2x}", "${:n2y}"], { name: zC2, visible: false, withLabel: false }]
        - [line, [zC1, zC2], { strokeColor: "#c1121f", strokeWidth: 1.4 }]
        # angle droit entre la droite et le côté : sommet de l’angle, bras porté
        # par la droite, bras porté par le côté et tourné vers le milieu
        - [point, ["${:a2x}", "${:a2y}"], { name: zCD, visible: false, withLabel: false }]
        - [point, ["${MMmath.round(:a2x+(:e2?:v2x::w2*:u2x)*0.4,4)}", "${MMmath.round(:a2y+(:e2?:v2y::w2*:u2y)*0.4,4)}"], { name: zCE, visible: false, withLabel: false }]
        - [point, ["${MMmath.round(:a2x+(:e2?:w2*:u2x::v2x)*0.4,4)}", "${MMmath.round(:a2y+(:e2?:w2*:u2y::v2y)*0.4,4)}"], { name: zCF, visible: false, withLabel: false }]
        - [angle, [zCE, zCD, zCF], { radius: 0.28, label: { visible: false }, strokeColor: "#c1121f", strokeWidth: 1.2, fillColor: "#ffd166", fillOpacity: 0.6, visible: "${:codeAngle3}" }]
        # milieu du côté : une même marque au milieu de chaque demi-côté
        - [point, ["${MMmath.round((:x0+:m2x)/2+0.14*:v2x,4)}", "${MMmath.round((:y0+:m2y)/2+0.14*:v2y,4)}"], { name: zCG, visible: false, withLabel: false }]
        - [point, ["${MMmath.round((:x0+:m2x)/2-0.14*:v2x,4)}", "${MMmath.round((:y0+:m2y)/2-0.14*:v2y,4)}"], { name: zCH, visible: false, withLabel: false }]
        - [segment, [zCG, zCH], { strokeColor: "#7b2cbf", strokeWidth: 1.4, visible: "${:codeMilieu3}" }]
        - [point, ["${MMmath.round((:x1+:m2x)/2+0.14*:v2x,4)}", "${MMmath.round((:y1+:m2y)/2+0.14*:v2y,4)}"], { name: zCJ, visible: false, withLabel: false }]
        - [point, ["${MMmath.round((:x1+:m2x)/2-0.14*:v2x,4)}", "${MMmath.round((:y1+:m2y)/2-0.14*:v2y,4)}"], { name: zCK, visible: false, withLabel: false }]
        - [segment, [zCJ, zCK], { strokeColor: "#7b2cbf", strokeWidth: 1.4, visible: "${:codeMilieu3}" }]
        - [point, ["${MMmath.round(:x2+:p2x*1.1,4)}", "${MMmath.round(:y2+:p2y*1.1,4)}"], { name: zCQ1, visible: false, withLabel: false }]
        - [point, ["${MMmath.round(:x2+:db2x*1.1,4)}", "${MMmath.round(:y2+:db2y*1.1,4)}"], { name: zCQ2, visible: false, withLabel: false }]
        - [point, ["${MMmath.round(:x2+:q2x*1.1,4)}", "${MMmath.round(:y2+:q2y*1.1,4)}"], { name: zCQ3, visible: false, withLabel: false }]
