    - "<svg width='12em' height='11.04em' viewBox='0 0 200 184' xmlns='http://www.w3.org/2000/svg'><g fill='none' stroke-linecap='round' stroke-linejoin='round'><path d='M61.1 49.7 C65.7 69.2, 78.4 89.6, 104.7 151.5 M102.2 149.4 C115.7 137.5, 127.6 127.3, 159.2 101 M157.5 99.8 C129.8 84.3, 99.5 70.7, 61.1 49.8' stroke='#118ab2' stroke-width='2'/><path d='M59.9 48.6 C71.9 65.3, 83.8 83.3, 120.9 132' stroke='#c1121f' stroke-width='2'/></g><g font-size='14' fill='#118ab2' text-anchor='middle' dominant-baseline='central'><text x='52' y='40'>%A%</text><text x='102' y='162'>%B%</text><text x='170' y='99'>%C%</text><text x='128' y='146'>%M%</text></g></svg>"
