title: "Droites remarquables du triangle : médiatrices, hauteurs, médianes et bissectrices"
description: "Reconnaître, coder une figure : médiatrice, hauteur, médiane, bissectrice, triangle. Non adapté au mode interactif (online/duel)."
ID: 5GB9
type: text
textSize: medium
# L’énoncé ne varie que par les lettres des sommets, et la réponse est constante
# dans presque toutes les séries : la déduplication question+valeur n’en
# laisserait passer qu’une seule. repeat:1 la lève (fenêtre d’une question, donc
# jamais deux occurrences dedans). La variété vient des lettres et de la figure.
repeat: 1
dest:
  - 5GB
  - 4GB
consts:
  # lettres des sommets. Ni I ni O (confusion avec 1 et 0), ni X, Y, Z (réservés
  # aux axes et aux inconnues).
  pool: "ABCDEFGHJKLMNPQRSTUVW"
  formes: [quelconque, obtusangle, isocèle, équilatéral, rectangle]
  # ─── forme du triangle : les trois sommets sont posés sur un même cercle, ce
  # qui donne le contrôle de la forme par les arcs qu’ils y découpent.
  # arcs[forme][n] = [arc V0→V1, arc V1→V2, arc V2→V0], en degrés, de somme 360.
  # L’angle inscrit en V0 vaut arcs[1]/2, celui en V1 arcs[2]/2, celui en V2
  # arcs[0]/2 : c’est ce qui fixe la nature du triangle. V0 porte toujours la
  # particularité — angle obtus, sommet principal de l’isocèle, angle droit.
  # Le centre du cercle est l’origine du repère, donc le point de concours des
  # médiatrices ; l’orthocentre est en V0+V1+V2, et les arcs sont choisis pour
  # qu’il reste dans le cadre.
  arcs:
    # 0 — quelconque : trois arcs distincts, tous inférieurs à 180°, assez
    # écartés pour que le triangle n’ait pas l’air isocèle
    - [[100, 140, 120], [90, 150, 120], [80, 160, 120], [110, 160, 90], [95, 145, 120]]
    # 1 — obtusangle : l’arc V1→V2 dépasse 180°, donc l’angle en V0 dépasse 90°.
    # Les arcs sont aussi choisis pour qu’aucune médiatrice ne frôle un sommet :
    # elle aurait l’air d’y passer, et se confondrait avec une hauteur.
    - [[70, 200, 90], [60, 210, 90], [95, 205, 60], [65, 205, 90], [95, 200, 65]]
    # 2 — isocèle de sommet principal V0 : arcs[0] = arcs[2], donc V0V1 = V0V2.
    # Le dernier est isocèle obtusangle.
    - [[100, 160, 100], [140, 80, 140], [110, 140, 110], [130, 100, 130], [80, 200, 80]]
    # 3 — équilatéral : la variété ne vient plus que de l’orientation
    - [[120, 120, 120]]
    # 4 — rectangle en V0 : l’arc V1→V2 est un demi-cercle, [V1V2] l’hypoténuse
    - [[70, 180, 110], [110, 180, 70], [60, 180, 120], [120, 180, 60], [100, 180, 80]]
  # ─── réponses. Les constantes sont traversées par la substitution des
  # variables (resolveVars() les repasse après avoir tiré les variables), on peut
  # donc y écrire :nS ou :nU comme dans un énoncé.
  repMediatrice: "C’est la <span class='red'>médiatrice de $$[:nU:nV]$$</span>.<br><i>Le codage le dit : elle coupe ce côté en son milieu, perpendiculairement.</i>"
  repHauteur: "C’est la <span class='red'>hauteur issue de $$:nS$$</span>.<br><i>Elle passe par le sommet $$:nS$$ et, le codage le dit, elle est perpendiculaire au côté $$[:nU:nV]$$.</i>"
  repMediane: "C’est la <span class='red'>médiane issue de $$:nS$$</span>.<br><i>Elle joint le sommet $$:nS$$ au milieu du côté $$[:nU:nV]$$, que le codage désigne.</i>"
  # cas où la droite tracée est un axe de symétrie du triangle : les trois
  # droites remarquables y sont confondues, aucune réponse ne peut être exigée
  # plutôt qu’une autre
  repAxe: '${"C’est <span class=''red''>à la fois la médiatrice de $$["+:nU+:nV+"]$$, la hauteur issue de $$"+:nS+"$$ et la médiane issue de $$"+:nS+"$$</span>.<br><i>"+(:forme===3?"Ce triangle est équilatéral : la médiatrice, la hauteur et la médiane de chaque côté y sont confondues.":"Ce triangle est isocèle de sommet principal $$"+:nS+"$$ : la médiatrice, la hauteur et la médiane issues de ce sommet y sont confondues.")+"</i>"}'
  repMediatrices: "Ce sont les <span class='red'>trois médiatrices</span> du triangle.<br><i>Chacune coupe un côté en son milieu, perpendiculairement. Elles se coupent en un même point, le centre du cercle circonscrit.</i>"
  repHauteurs: "Ce sont les <span class='red'>trois hauteurs</span> du triangle.<br><i>Chacune passe par un sommet et est perpendiculaire au côté opposé. Elles se coupent en un même point, l’orthocentre.</i>"
  repMedianes: "Ce sont les <span class='red'>trois médianes</span> du triangle.<br><i>Chacune joint un sommet au milieu du côté opposé. Elles se coupent en un même point, le centre de gravité.</i>"
  repAxe3: "Ce sont <span class='red'>à la fois les médiatrices, les hauteurs et les médianes</span> du triangle.<br><i>Dans un triangle équilatéral, ces trois familles de droites sont confondues : ce sont les trois axes de symétrie.</i>"
  repCodeHauteur: "Il faut coder <span class='red'>l’angle droit</span> en $$:nD$$, entre $$(:nA:nD)$$ et le côté $$[:nB:nC]$$.<br><i>Une hauteur est perpendiculaire au côté opposé au sommet dont elle est issue.</i>"
  repCodeMediane: "Il faut coder que <span class='red'>$$:nD$$ est le milieu de $$[:nB:nC]$$</span>, par une même marque sur $$[:nB:nD]$$ et sur $$[:nD:nC]$$.<br><i>Une médiane joint un sommet au milieu du côté opposé.</i>"
  repCodeBissectrice: "Il faut coder que <span class='red'>l’angle $$:nB:nA:nD$$ est égal à l’angle $$:nD:nA:nC$$</span>, par un même codage (un même nombre d’arcs) sur chacun.<br><i>Une bissectrice partage l’angle en deux angles de même mesure.</i>"
  repCodeMediatrice: "Il faut coder à la fois <span class='red'>l’angle droit en $$:nD$$</span> et que <span class='red'>$$:nD$$ est le milieu de $$[:nB:nC]$$</span>, par une marque d’angle droit et une même marque sur $$[:nB:nD]$$ et sur $$[:nD:nC]$$.<br><i>Une médiatrice est perpendiculaire au côté et passe par son milieu.</i>"
  repBissectrice: "C’est la <span class='red'>bissectrice issue de $$:nS$$</span>.<br><i>Le codage le dit : elle partage l’angle $$\\widehat{:nU:nS:nV}$$ en deux angles égaux.</i>"
  repBissectrices: "Ce sont les <span class='red'>trois bissectrices</span> du triangle.<br><i>Chacune part d’un sommet et partage l’angle en deux angles égaux. Elles se coupent en un même point, le centre du cercle inscrit.</i>"
  # ─── figures à main levée de la dernière série, produites par
  # tools/figures-5GB9.mjs (Rough.js). Elles ne portent aucun codage : c’est
  # l’énoncé qui donne la nature de la droite tracée, et l’élève dit le codage
  # qui la traduirait. Le tremblé du tracé rappelle qu’il ne faut pas mesurer —
  # le pied de la droite n’est ni le milieu du côté ni le pied de la hauteur.
  # Les lettres sont laissées en marques %A% à %C% et %M%, remplacées à la
  # génération : les constantes ne traversent pas la substitution de variables
  # au moment où la variable fig est tirée.
  figs:
    # 0 — quelconque
    - "<svg width='12em' height='11.04em' viewBox='0 0 200 184' xmlns='http://www.w3.org/2000/svg'><g fill='none' stroke-linecap='round' stroke-linejoin='round'><path d='M154.7 108.8 C143.5 93, 138.6 80.7, 107.2 36 M109 33.5 C93.5 67.7, 73.1 97.6, 58.6 130.9 M56.1 129.3 C90.6 124.8, 126.3 118.9, 156.1 109.5' stroke='#118ab2' stroke-width='2'/><path d='M153.4 112 C138.4 110.2, 122 107.3, 74.2 97.1' stroke='#c1121f' stroke-width='2'/></g><g font-size='14' fill='#118ab2' text-anchor='middle' dominant-baseline='central'><text x='167' y='115'>%A%</text><text x='109' y='22'>%B%</text><text x='47' y='138'>%C%</text><text x='59' y='100'>%M%</text></g></svg>"
    # 1 — quelconque
    - "<svg width='12em' height='11.04em' viewBox='0 0 200 184' xmlns='http://www.w3.org/2000/svg'><g fill='none' stroke-linecap='round' stroke-linejoin='round'><path d='M73.6 141.5 C87.7 133.5, 109.1 126.5, 156.5 101.4 M155.7 100.7 C130.4 89.3, 99.8 79.4, 51.2 63.1 M50.7 64.2 C58.8 87.6, 63.8 113.2, 72.2 143' stroke='#118ab2' stroke-width='2'/><path d='M72.4 144.7 C81 133, 89.2 119.9, 115.2 85.1' stroke='#c1121f' stroke-width='2'/></g><g font-size='14' fill='#118ab2' text-anchor='middle' dominant-baseline='central'><text x='66' y='154'>%A%</text><text x='170' y='101'>%B%</text><text x='40' y='56'>%C%</text><text x='127' y='77'>%M%</text></g></svg>"
