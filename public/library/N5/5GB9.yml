      - '${"angle "+:nB+:nA+:nD+" égal à angle "+:nD+:nA+:nC}'
      - '${"angle "+:nB+:nA+:nD+"=angle "+:nD+:nA+:nC}'
    figure: *figureCodage
  - name: Coder une médiatrice
    vars:
      cod: 3
    question: Sur cette figure à main levée, la droite $$(:nA:nD)$$ est une :codNom du triangle $$:nom$$.<br>Coder la figure.
    shortq: coder la figure ?
    answer: ${:repCodeMediatrice}
    value:
      - "angle droit et milieu"
      - '${"angle droit en "+:nD+" et milieu de ["+:nB+:nC+"]"}'
      - '${"angle droit en "+:nD}'
      - '${"milieu de ["+:nB+:nC+"]"}'
