title: Relation entre deux angles formés par des droites coupées par une sécante
description: Adjacents, supplémentaires, opposés par le sommet, correspondants, alternes-internes
dest:
  - 5GB
  - 4GB
  - 3GB
type: text
keys:
  - o
  - n
  - corr
  - supp
  - altint
  - ad&sup
  - opps
  - ssln
repeat: 4
consts:
  colors: [
      black,
      blue,
      red,
      green,
      purple,
      orange,
      brown,
      grey,
      chocolate,
      coral,
      darkblue,
      darkcyan,
      indigo,
      olive,
      violet,
      navy
      orangered,
      teal,
      tomato,
      turquoise,
    ]
vars:
  prop: [true, false]
  cc: "0_${:colors.length-1}_8_^&"
  sizes: "10_25_8"
options:
  - name: Reconnaitre des angles correspondants
    consts:
      corr: [[1, 5], [2, 6], [3, 7], [4, 8]]
      autre:
        [
          [1, 8],
          [2, 7],
          [1, 6],
          [2, 5],
          [4, 5],
          [3, 6],
          [4, 7],
          [3, 8],
          [1, 2],
          [2, 3],
          [3, 4],
          [4, 1],
          [5, 6],
          [6, 7],
          [7, 8],
          [8, 5],
          [1, 3],
          [2, 4],
          [5, 7],
          [6, 8],
          [2, 8],
          [3, 5],
        ]
    vars:
      paire: "0_${:prop?:corr.length-1::autre.length-1}"
      a1: "${:prop?:corr[:paire][0]::autre[:paire][0]}"
      a2: "${:prop?:corr[:paire][1]::autre[:paire][1]}"
      ang1: "70_110"
      ang2: "70_110_^${:ang1},${:ang1-1},${:ang1+1}"
    question: "Les angles marqués sont-ils correspondants ?"
    answer: "${:prop?'Oui':'Non'}, les angles marqués <b>${:prop?'sont':'ne sont pas'}</b> correspondants."
    value: ["${:prop?'oui':'non'}", "${:prop?'O':'N'}"]
  - name: Reconnaitre des angles alternes-internes
    consts:
      alt: [[2, 8], [3, 5]]
      autre:
        [
          [1, 8],
          [2, 7],
          [1, 6],
          [2, 5],
          [4, 5],
          [3, 6],
          [4, 7],
          [3, 8],
          [1, 2],
          [2, 3],
          [3, 4],
          [4, 1],
          [5, 6],
          [6, 7],
          [7, 8],
          [8, 5],
          [1, 5],
          [2, 6],
          [3, 7],
          [4, 8],
          [1, 3],
          [2, 4],
          [5, 7],
          [6, 8],
        ]
    vars:
      paire: "0_${:prop?:alt.length-1::autre.length-1}"
      a1: "${:prop?:alt[:paire][0]::autre[:paire][0]}"
      a2: "${:prop?:alt[:paire][1]::autre[:paire][1]}"
      ang1: "70_110"
      ang2: "70_110_^${:ang1},${:ang1-1},${:ang1+1}"
    question: "Les angles marqués sont-ils alternes-internes ?"
    answer: "${:prop?'Oui':'Non'}, les angles marqués <b>${:prop?'sont':'ne sont pas'}</b> alternes-internes."
    value: ["${:prop?'oui':'non'}", "${:prop?'O':'N'}"]
  - name: Reconnaitre des angles opposés par le sommet
    consts:
      opp: [[1, 3], [2, 4], [5, 7], [6, 8]]
      autre:
        [
          [1, 8],
          [2, 7],
          [1, 6],
          [2, 5],
          [4, 5],
          [3, 6],
          [4, 7],
          [3, 8],
          [1, 2],
          [2, 3],
          [3, 4],
          [4, 1],
          [5, 6],
          [6, 7],
          [7, 8],
          [8, 5],
          [1, 5],
          [2, 6],
          [3, 7],
          [4, 8],
          [2, 8],
          [3, 5],
        ]
    vars:
      paire: "0_${:prop?:opp.length-1::autre.length-1}"
      a1: "${:prop?:opp[:paire][0]::autre[:paire][0]}"
      a2: "${:prop?:opp[:paire][1]::autre[:paire][1]}"
      ang1: "70_110"
      ang2: "70_110_^${:ang1},${:ang1-1},${:ang1+1}"
    question: "Les angles marqués sont-ils opposés par le sommet ?"
    answer: "${:prop?'Oui':'Non'}, les angles marqués <b>${:prop?'sont':'ne sont pas'}</b> opposés par le sommet."
    value: ["${:prop?'oui':'non'}", "${:prop?'O':'N'}"]
  - name: Angles entre deux droites non parallèles
    consts:
      adj: [[1, 2], [2, 3], [3, 4], [4, 1], [5, 6], [6, 7], [7, 8], [8, 5]]
      corr: [[1, 5], [2, 6], [3, 7], [4, 8]]
      opp: [[1, 3], [2, 4], [5, 7], [6, 8]]
      alt: [[2, 8], [3, 5]]
      autre: [[1, 8], [2, 7], [1, 6], [2, 5], [4, 5], [3, 6], [4, 7], [3, 8]]
    vars:
      chx: "0_4"
      paire: "0_${:chx==0?:adj.length-1::chx==1?:corr.length-1::chx==2?:opp.length-1::chx==3?:alt.length-1::autre.length-1}"
      a1: "${:chx==0?:adj[:paire][0]::chx==1?:corr[:paire][0]::chx==2?:opp[:paire][0]::chx==3?:alt[:paire][0]::autre[:paire][0]}"
      a2: "${:chx==0?:adj[:paire][1]::chx==1?:corr[:paire][1]::chx==2?:opp[:paire][1]::chx==3?:alt[:paire][1]::autre[:paire][1]}"
      ang1: "70_110"
      ang2: "70_110_^${:ang1},${:ang1-1},${:ang1+1}"
    question: "Les droites ne sont pas parallèles. Que dire des angles marqués ?<br><i>Utiliser le vocabulaire : adjacents, supplémentaires, correspondants, opposés par le sommet, alternes-internes, sans lien.</i>."
    answer: Les angles marqués sont <span class='red'>${:chx==0?'adjacents et supplémentaires'::chx==1?'correspondants'::chx==2?'opposés par le sommet'::chx==3?'alternes-internes':'sans lien'}</span>.
    value: ${:chx==0?'adjacents et supplémentaires'::chx==1?'correspondants'::chx==2?'opposés par le sommet'::chx==3?'alternes-internes':'sans lien'}
  - name: Angles entre deux droites parallèles
    consts:
      adj: [[1, 2], [2, 3], [3, 4], [4, 1], [5, 6], [6, 7], [7, 8], [8, 5]]
      supp: [[1, 6], [1, 8], [2, 5], [2, 7], [3, 6], [3, 8], [4, 5], [4, 7]]
      corr: [[1, 5], [2, 6], [3, 7], [4, 8]]
      opp: [[1, 3], [2, 4], [5, 7], [6, 8]]
      alt: [[2, 8], [3, 5]]
    vars:
      chx: "0_4"
      paire: "0_${:chx==0?:adj.length-1::chx==1?:supp.length-1::chx==2?:corr.length-1::chx==3?:opp.length-1::alt.length-1}"
      a1: "${:chx==0?:adj[:paire][0]::chx==1?:supp[:paire][0]::chx==2?:corr[:paire][0]::chx==3?:opp[:paire][0]::alt[:paire][0]}"
      a2: "${:chx==0?:adj[:paire][1]::chx==1?:supp[:paire][1]::chx==2?:corr[:paire][1]::chx==3?:opp[:paire][1]::alt[:paire][1]}"
      ang1: "70_110"
      ang2: "${:ang1}"
    question: "Deux droites parallèles sont coupées par une sécante. Que dire des angles marqués ?<br><i>Utiliser le vocabulaire : adjacents, supplémentaires, correspondants, opposés par le sommet, alternes-internes, sans lien</i>."
    answer: Les angles marqués sont <span class='red'>${:chx==0?'adjacents et supplémentaires'::chx==1?'supplémentaires'::chx==2?'correspondants'::chx==3?'opposés par le sommet'::chx==4?'alternes-internes':'sans lien'}</span>.
    value: ${:chx==0?'adjacents et supplémentaires'::chx==1?'supplémentaires'::chx==2?'correspondants'::chx==3?'opposés par le sommet'::chx==4?'alternes-internes':'sans lien'}
figure:
  type: graph
  boundingbox: [-5, 5, 10, -5]
  axis: false
  grid: false
  content:
    - [point, [0, 0], { name: O, visible: false, label: { visible: false } }]
    - [point, [5, 0], { name: O2, visible: false, label: { visible: false } }]
    - [point, [7, 0], { name: A, visible: false, label: { visible: false } }]
    - [
        point,
        [
          "${Math.cos(:ang1*Math.PI/180)*2+5}",
          "${Math.sin(:ang1*Math.PI/180)*2}",
        ],
        { name: B, visible: false, label: { visible: false } },
      ]
    - [
        point,
        [
          "${-Math.cos(:ang1*Math.PI/180)*2+5}",
          "${-Math.sin(:ang1*Math.PI/180)*2}",
        ],
        { name: C, visible: false, label: { visible: false } },
      ]
    - [point, [2, 0], { name: D, visible: false, label: { visible: false } }]
    - [
        point,
        [
          "${Math.cos(:ang2*Math.PI/180)*2}",
          "${Math.sin(:ang2*Math.PI/180)*2}",
        ],
        { name: E, visible: false, label: { visible: false } },
      ]
    - [point, [-2, 0], { name: F, visible: false, label: { visible: false } }]
    - [
        point,
        [
          "${-Math.cos(:ang2*Math.PI/180)*2}",
          "${-Math.sin(:ang2*Math.PI/180)*2}",
        ],
        { name: G, visible: false, label: { visible: false } },
      ]
    - [line, [F, A]]
    - [line, [B, C]]
    - [line, [E, G]]
    - [
        angle,
        [A, O2, B],
        {
          visible: "${[:a1,:a2].includes(1)?1:0}",
          name:a1,
          radius: "${:sizes[0]*0.1}",
          label: { visible: false },
          color: "${:colors[:cc[0]]}",
        },
      ]
    - [
        angle,
        [B, O2, D],
        {
          visible: "${[:a1,:a2].includes(2)?1:0}",
          name:a2,
          radius: "${:sizes[1]*0.1}",
          label: { visible: false },
          color: "${:colors[:cc[1]]}",
        },
      ]
    - [
        angle,
        [D, O2, C],
        {
          visible: "${[:a1,:a2].includes(3)?1:0}",
          name:a3,
          radius: "${:sizes[2]*0.1}",
          label: { visible: false },
          color: "${:colors[:cc[2]]}",
        },
      ]
    - [
        angle,
        [C, O2, A],
        {
          visible: "${[:a1,:a2].includes(4)?1:0}",
          name:a4,
          radius: "${:sizes[3]*0.1}",
          label: { visible: false },
          color: "${:colors[:cc[3]]}",
        },
      ]
    - [
        angle,
        [D, O, E],
        {
          visible: "${[:a1,:a2].includes(5)?1:0}",
          name:a5,
          radius: "${:sizes[4]*0.1}",
          label: { visible: false },
          color: "${:colors[:cc[4]]}",
        },
      ]
    - [
        angle,
        [E, O, F],
        {
          visible: "${[:a1,:a2].includes(6)?1:0}",
          name:a6,
          radius: "${:sizes[5]*0.1}",
          label: { visible: false },
          color: "${:colors[:cc[5]]}",
        },
      ]
    - [
        angle,
        [F, O, G],
        {
          visible: "${[:a1,:a2].includes(7)?1:0}",
          name:a7,
          radius: "${:sizes[6]*0.1}",
          label: { visible: false },
          color: "${:colors[:cc[6]]}",
        },
      ]
    - [
        angle,
        [G, O, D],
        {
          visible: "${[:a1,:a2].includes(8)?1:0}",
          name:a8,
          radius: "${:sizes[7]*0.1}",
          label: { visible: false },
          color: "${:colors[:cc[7]]}",
        },
      ]
