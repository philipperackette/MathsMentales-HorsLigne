  # nature tirée : fixée par chaque option, mélangée dans la dernière
  cas: 0
  nature: ${:natures[:cas]}
  natureSansAccent: ${:naturesSansAccent[:cas]}
  lecture: ${:lectures[:cas]}
  regle: ${:regles[:cas]}
  # ─── lettres des sommets : quatre consécutives de pool, prises au hasard.
  # Le point d’intersection des diagonales n’est pas nommé : les quatre secteurs
  # qu’elles découpent sont trop étroits pour y écrire une lettre sans toucher
  # un tracé ou une marque de codage.
  lp: "0_${:pool.length-4}"
  nA: ${:pool[:lp]}
  nB: ${:pool[:lp+1]}
  nC: ${:pool[:lp+2]}
  nD: ${:pool[:lp+3]}
  nom: ${:nA+:nB+:nC+:nD}
  # ─── figure : un des six tracés de la nature tirée, où l’on écrit les lettres
  # des sommets à la place des marques
  numfig: "0_5"
  fig: ${:figs[:cas][:numfig].replaceAll('%A%',:nA).replaceAll('%B%',:nB).replaceAll('%C%',:nC).replaceAll('%D%',:nD)}
question: D’après le codage de la figure, quelle est la nature du quadrilatère $$:nom$$ ?
shortq: nature de $$:nom$$ ?
answer: $$:nom$$ est un <span class='red'>:nature</span>.<br>:lecture<br><i>:regle</i>
value: [":nature", ":natureSansAccent"]
figure:
  type: svg
  content: ${:fig}
options:
  - name: Parallélogramme
    vars:
      cas: 0
  - name: Rectangle
    vars:
      cas: 1
  - name: Losange
    vars:
      cas: 2
  - name: Carré
    vars:
      cas: 3
