title: Nature d’un quadrilatère d’après le codage de ses diagonales
description: >
  Figures à main levée, carré, rectangle, losange, parallélogramme.
ID: 5GB8
type: text
textSize: medium
# L’énoncé ne varie que par les lettres des sommets, et la réponse est constante
# dans les quatre premières séries : la déduplication question+valeur n’en
# laisserait passer qu’une seule. repeat:1 la lève (fenêtre d’une question, donc
# jamais deux occurrences dedans). La variété vient des lettres et de la figure.
repeat: 1
dest:
  - 5GB
  - 4GB
consigne: Lire le codage de la figure, sans mesurer.
consts:
  # lettres des sommets. Ni I ni O (confusion avec 1 et 0), ni X, Y, Z (réservés
  # aux axes et aux inconnues).
  pool: "ABCDEFGHJKLMNPQRSTUVW"
  # cas : 0 = parallélogramme, 1 = rectangle, 2 = losange, 3 = carré
  natures: [parallélogramme, rectangle, losange, carré]
  # même liste sans accent : les deux écritures sont acceptées en réponse
  naturesSansAccent: [parallelogramme, rectangle, losange, carre]
  lectures:
    - Ses diagonales se coupent en leur milieu.
    - Ses diagonales se coupent en leur milieu et ont la même longueur.
    - Ses diagonales se coupent en leur milieu et sont perpendiculaires.
    - Ses diagonales se coupent en leur milieu, ont la même longueur et sont perpendiculaires.
  regles:
    - Si un quadrilatère a ses diagonales de même milieu, alors c’est un parallélogramme.
    - Si un parallélogramme a ses diagonales de même longueur, alors c’est un rectangle.
    - Si un parallélogramme a ses diagonales perpendiculaires, alors c’est un losange.
    - Si un parallélogramme a ses diagonales de même longueur et perpendiculaires, alors c’est un carré.
  # ─── figures : six tracés par nature, dessinés d’avance plutôt que construits
  # à la volée par JSXGraph. Elles sont produites par tools/figures-5GB8.mjs
  # (Rough.js), qui bâtit chaque quadrilatère sur ses diagonales de même milieu,
  # puis pose le codage : un trait au milieu de chaque demi-diagonale, doublé sur
  # la seconde diagonale quand les deux diagonales n’ont pas la même longueur, et
  # l’angle droit à leur intersection quand elles sont perpendiculaires. Le tracé
  # tremblé donne l’aspect d’une figure à main levée, qui dit assez qu’il ne faut
  # pas mesurer. Le repère est celui de l’ancienne figure : 20 px par unité dans
  # un cadre de 200 x 184.
  #
  # Le dessin ne montre pas forcément la nature annoncée : sur les six tracés
  # d’une nature, deux seulement lui sont conformes, les quatre autres sont
  # dessinés dans une des trois autres natures. Un carré dessiné en losange
  # garde le codage du carré, et c’est ce codage qui répond. L’élève qui se fie
  # à ses yeux se trompe donc deux fois sur trois.
  #
  # Les noms des sommets sont laissés en marques %A% à %D%, remplacées à la
  # génération : les figures sont des constantes, que la substitution de
  # variables ne traverse pas.
  #
  # figs[cas][numéro] : les quatre listes sont dans l’ordre des natures.
  figs:
    # 0 — parallélogramme
    -
      # dessiné en parallélogramme (conforme)
