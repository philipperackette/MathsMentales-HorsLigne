title: Nommer un polygone d’après son codage
description: >
  Figures à main levée, quadrilatère, trapèze, parallélogramme, losange, rectangle, carré, triangle rectangle, pentagone.
ID: 5GB10
type: text
textSize: medium
# L’énoncé ne varie que par les lettres des sommets, et la réponse est constante
# dans chaque série : la déduplication question+valeur n’en laisserait passer
# qu’une seule. repeat:1 la lève (fenêtre d’une question, donc jamais deux
# occurrences dedans). La variété vient des lettres et de la figure.
repeat: 1
dest:
  - 5GB
  - 4GB
consts:
  # lettres des sommets. Ni I ni O (confusion avec 1 et 0), ni X, Y, Z (réservés
  # aux axes et aux inconnues).
  pool: "ABCDEFGHJKLMNPQRSTUVW"
  # cas : 0 quadrilatère, 1 trapèze, 2 parallélogramme, 3 losange, 4 rectangle,
  # 5 carré, 6 triangle rectangle, 7 pentagone
  natures: [quadrilatère, trapèze, parallélogramme, losange, rectangle, carré, "triangle rectangle", pentagone]
  # même liste sans accent : les deux écritures sont acceptées en réponse
  naturesSansAccent: [quadrilatere, trapeze, parallelogramme, losange, rectangle, carre, "triangle rectangle", pentagone]
  # nombre de sommets de chaque nature
  nls: [4, 4, 4, 4, 4, 4, 3, 5]
  lectures:
    - Aucun codage particulier n’apparaît sur ses côtés ni sur ses angles.
    - "La figure porte l’indication ($$:nA$$$$:nB$$)//($$:nC$$$$:nD$$) : ces deux côtés sont parallèles."
    - "Les côtés opposés portent le même codage deux à deux : :cAB = :cCD et :cBC = :cDA."
    - Les quatre côtés portent le même codage : ils ont tous la même longueur.
    - Les quatre angles portent le même codage : ils sont tous droits.
    - Les quatre angles sont droits et les quatre côtés ont la même longueur.
    - "L’angle en $$:nA$$ porte le codage de l’angle droit."
    - "La figure est fermée par cinq côtés : $$:nA$$, $$:nB$$, $$:nC$$, $$:nD$$ et $$:nE$$."
  regles:
    - Un polygone fermé à quatre côtés est un quadrilatère.
    - Si un quadrilatère a deux côtés parallèles, alors c’est un trapèze.
    - Si un quadrilatère a ses côtés opposés de la même longueur deux à deux, alors c’est un parallélogramme.
    - Si un quadrilatère a ses quatre côtés de la même longueur, alors c’est un losange.
    - Si un quadrilatère a ses quatre angles droits, alors c’est un rectangle.
    - Si un quadrilatère a ses quatre angles droits et ses quatre côtés de la même longueur, alors c’est un carré.
    - Un triangle qui a un angle droit est un triangle rectangle.
    - Un polygone fermé à cinq côtés est un pentagone.
  # ─── figures : six tracés par nature, dessinés d’avance plutôt que construits
  # à la volée par JSXGraph, avec tools/figures-5GB10.mjs (Rough.js). Le codage
  # porte sur les côtés et les angles du polygone (traits de longueur égale,
  # petit carré d’angle droit), pas sur ses diagonales comme dans 5GB8. Le
  # parallélisme (trapèze) ne se marque pas par un chevron, illisible sur un
  # tracé tremblé : il est écrit en toutes lettres à côté de la figure, du
  # genre (AB)//(CD). Le tracé tremblé donne l’aspect d’une figure à main
  # levée, qui dit assez qu’il ne faut pas mesurer.
  #
  # Pour les six natures de quadrilatères (cas 0 à 5), le dessin ne montre pas
  # forcément la nature annoncée : sur les six tracés d’une nature, deux
  # seulement lui sont conformes, les quatre autres sont dessinés dans une des
  # cinq autres natures de quadrilatères. Le codage, lui, reste toujours celui
  # de la nature annoncée. L’élève qui se fie à ses yeux se trompe donc le plus
  # souvent. Le triangle rectangle (cas 6) et le pentagone (cas 7) n’ont pas de
  # forme sœur de même nombre de côtés : leurs six tracés varient seulement de
  # forme et d’orientation, sans mentir — l’angle droit du triangle rectangle
  # est toujours porté par le premier sommet nommé.
  #
  # Les noms des sommets sont laissés en marques %A% à %E%, remplacées à la
  # génération : les figures sont des constantes, que la substitution de
  # variables ne traverse pas.
  #
  # figs[cas][numéro] : huit listes de six tracés, dans l’ordre des natures.
  figs:
    # 0 — quadrilatère
    -
      # dessiné en quadrilatère (conforme)
