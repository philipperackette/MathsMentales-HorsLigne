vars:
  # nature tirée : fixée par chaque option, mélangée dans les deux dernières
  cas: 0
  nature: ${:natures[:cas]}
  natureSansAccent: ${:naturesSansAccent[:cas]}
  lecture: ${:lectures[:cas]}
  regle: ${:regles[:cas]}
  # ─── lettres des sommets : autant que la nature en compte, consécutives dans
  # pool, prises au hasard.
  nl: ${:nls[:cas]}
  lp: "0_${:pool.length-:nl}"
  nA: ${:pool[:lp]}
  nB: ${:pool[:lp+1]}
  nC: ${:pool[:lp+2]}
  nD: ${:nl>3?:pool[:lp+3]:''}
  nE: ${:nl>4?:pool[:lp+4]:''}
  nom: ${:nl===3?:nA+:nB+:nC:(:nl===5?:nA+:nB+:nC+:nD+:nE::nA+:nB+:nC+:nD)}
  # ─── noms des côtés opposés, pour les lectures des cas trapèze et
  # parallélogramme : [AB] face à [CD], [BC] face à [DA]
  cAB: ${'$$['+:nA+:nB+']$$'}
  cBC: ${'$$['+:nB+:nC+']$$'}
  cCD: ${'$$['+:nC+:nD+']$$'}
  cDA: ${'$$['+:nD+:nA+']$$'}
  # ─── figure : un des six tracés de la nature tirée, où l’on écrit les
  # lettres des sommets à la place des marques
  numfig: "0_5"
  fig: ${:figs[:cas][:numfig].replaceAll('%A%',:nA).replaceAll('%B%',:nB).replaceAll('%C%',:nC).replaceAll('%D%',:nD).replaceAll('%E%',:nE)}
question: "D’après le codage de la figure, quelle est la nature de la figure $$:nom$$ ?"
shortq: "nature de $$:nom$$ ?"
answer: "$$:nom$$ est un <span class='red'>:nature</span>.<br>:lecture<br><i>:regle</i>"
value: [":nature", ":natureSansAccent"]
figure:
  type: svg
  content: ${:fig}
options:
  - name: Quadrilatère quelconque
    vars:
      cas: 0
  - name: Trapèze
    vars:
      cas: 1
  - name: Parallélogramme
    vars:
      cas: 2
  - name: Losange
    vars:
      cas: 3
  - name: Rectangle
    vars:
      cas: 4
  - name: Carré
    vars:
      cas: 5
  - name: Triangle rectangle
    vars:
      cas: 6
  - name: Pentagone
    vars:
      cas: 7
  - name: Quadrilatères particuliers mélangés
    vars:
      cas: [0, 1, 2, 3, 4, 5]
  - name: Toutes les figures mélangées
    vars:
      cas: [0, 1, 2, 3, 4, 5, 6, 7]
