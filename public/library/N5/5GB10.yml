      # dessiné en quadrilatère (conforme)
      - "<svg width='12em' height='11.04em' viewBox='0 0 200 184' xmlns='http://www.w3.org/2000/svg'><g fill='none' stroke-linecap='round' stroke-linejoin='round'><path d='M74.4 56.9 C69.9 66.2, 68.8 77.4, 60 99.2 M60.8 101.2 C74.3 108.4, 89.3 119.1, 104.5 133.6 M104.9 131.5 C112.6 120.8, 120.9 110.2, 140.9 82.7 M140 80.2 C121.7 76.2, 105.3 68.9, 74.6 59.9' stroke='#118ab2' stroke-width='2'/></g><g font-size='14' fill='#118ab2' text-anchor='middle' dominant-baseline='central'><text x='69' y='48'>%A%</text><text x='47' y='103'>%B%</text><text x='109' y='145'>%C%</text><text x='153' y='79'>%D%</text></g></svg>"
      # dessiné en carré (trompeuse)
      - "<svg width='12em' height='11.04em' viewBox='0 0 200 184' xmlns='http://www.w3.org/2000/svg'><g fill='none' stroke-linecap='round' stroke-linejoin='round'><path d='M76.6 44.9 C73.9 61.5, 64.9 73.6, 55 114.4 M51.9 113.1 C72 120, 89.4 126.7, 123.7 139.2 M122.9 138.5 C130.3 116, 140 88.4, 146.4 69.9 M148.3 70.6 C122.9 62.6, 98.2 53.9, 76.4 46' stroke='#118ab2' stroke-width='2'/></g><g font-size='14' fill='#118ab2' text-anchor='middle' dominant-baseline='central'><text x='72' y='34'>%A%</text><text x='42' y='120'>%B%</text><text x='128' y='150'>%C%</text><text x='158' y='64'>%D%</text></g></svg>"
