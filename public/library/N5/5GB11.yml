      - "<svg width='14.4em' height='12em' viewBox='0 0 240 200' xmlns='http://www.w3.org/2000/svg'><g fill='none' stroke-linecap='round' stroke-linejoin='round'><path d='M120 20 L24 76 M24 76 L56 172 M56 172 L184 172 M184 172 L216 76 M216 76 L120 20 M120 20 L56 172 M120 20 L184 172' stroke='#118ab2' stroke-width='2'/></g><g fill='#118ab2'><circle cx='120' cy='20' r='2.2'/><circle cx='24' cy='76' r='2.2'/><circle cx='56' cy='172' r='2.2'/><circle cx='184' cy='172' r='2.2'/><circle cx='216' cy='76' r='2.2'/></g><g font-size='14' fill='#118ab2' text-anchor='middle' dominant-baseline='central'><text x='120' y='10'>%0%</text><text x='14' y='73'>%1%</text><text x='49' y='179'>%2%</text><text x='191' y='179'>%3%</text><text x='226' y='73'>%4%</text></g></svg>"
      # 5 — triangle : triangle + trapèze + trapèze
      - "<svg width='14.4em' height='12em' viewBox='0 0 240 200' xmlns='http://www.w3.org/2000/svg'><g fill='none' stroke-linecap='round' stroke-linejoin='round'><path d='M120 20 L20 170 M20 170 L220 170 M220 170 L120 20 M75 87.4 L165 87.4 M48 128 L192 128' stroke='#118ab2' stroke-width='2'/><path d='M123.4 87.4 L116.6 83.4 M123.4 87.4 L116.6 91.4 M123.4 128 L116.6 124 M123.4 128 L116.6 132 M123.4 170 L116.6 166 M123.4 170 L116.6 174' stroke='#7b2cbf' stroke-width='2'/></g><g fill='#118ab2'><circle cx='120' cy='20' r='2.2'/><circle cx='20' cy='170' r='2.2'/><circle cx='220' cy='170' r='2.2'/><circle cx='75' cy='87.4' r='2.2'/><circle cx='165' cy='87.4' r='2.2'/><circle cx='48' cy='128' r='2.2'/><circle cx='192' cy='128' r='2.2'/></g><g font-size='14' fill='#118ab2' text-anchor='middle' dominant-baseline='central'><text x='120' y='10'>%0%</text><text x='11' y='174'>%1%</text><text x='229' y='174'>%2%</text><text x='67' y='82'>%3%</text><text x='173' y='82'>%4%</text><text x='38' y='129'>%5%</text><text x='202' y='129'>%6%</text></g></svg>"
      # 6 — rectangle : carré + rectangle + rectangle
      - "<svg width='14.4em' height='12em' viewBox='0 0 240 200' xmlns='http://www.w3.org/2000/svg'><path d='M16 42 L16 50.4 L24.4 50.4 L24.4 42 Z M224 42 L215.6 42 L215.6 50.4 L224 50.4 Z M68 42 L59.6 42 L59.6 50.4 L68 50.4 Z' fill='#ffd166' fill-opacity='0.7' stroke='none'/><g fill='none' stroke-linecap='round' stroke-linejoin='round'><path d='M16 42 L224 42 M224 42 L224 142 M224 142 L16 142 M16 142 L16 42 M68 42 L68 142 M168 42 L168 142' stroke='#118ab2' stroke-width='2'/><path d='M118 38.8 L118 45.2 M171.2 92 L164.8 92 M118 145.2 L118 138.8 M64.8 92 L71.2 92' stroke='#7b2cbf' stroke-width='2'/><path d='M16 50.4 L24.4 50.4 L24.4 42 M215.6 42 L215.6 50.4 L224 50.4 M59.6 42 L59.6 50.4 L68 50.4' stroke='#c1121f' stroke-width='1.5'/></g><g fill='#118ab2'><circle cx='16' cy='42' r='2.2'/><circle cx='224' cy='42' r='2.2'/><circle cx='224' cy='142' r='2.2'/><circle cx='16' cy='142' r='2.2'/><circle cx='68' cy='42' r='2.2'/><circle cx='168' cy='42' r='2.2'/><circle cx='168' cy='142' r='2.2'/><circle cx='68' cy='142' r='2.2'/></g><g font-size='14' fill='#118ab2' text-anchor='middle' dominant-baseline='central'><text x='8' y='38'>%0%</text><text x='232' y='38'>%1%</text><text x='232' y='146'>%2%</text><text x='8' y='146'>%3%</text><text x='61' y='35'>%4%</text><text x='175' y='35'>%5%</text><text x='175' y='149'>%6%</text><text x='61' y='149'>%7%</text></g></svg>"
      # 7 — trapèze : triangle + triangle
      - "<svg width='14.4em' height='12em' viewBox='0 0 240 200' xmlns='http://www.w3.org/2000/svg'><g fill='none' stroke-linecap='round' stroke-linejoin='round'><path d='M56 36 L164 36 M164 36 L224 168 M224 168 L16 168 M16 168 L56 36 M56 36 L224 168' stroke='#118ab2' stroke-width='2'/><path d='M113.4 36 L106.6 32 M113.4 36 L106.6 40 M123.4 168 L116.6 164 M123.4 168 L116.6 172' stroke='#7b2cbf' stroke-width='2'/></g><g fill='#118ab2'><circle cx='56' cy='36' r='2.2'/><circle cx='164' cy='36' r='2.2'/><circle cx='224' cy='168' r='2.2'/><circle cx='16' cy='168' r='2.2'/></g><g font-size='14' fill='#118ab2' text-anchor='middle' dominant-baseline='central'><text x='49' y='29'>%0%</text><text x='170' y='28'>%1%</text><text x='232' y='173'>%2%</text><text x='8' y='174'>%3%</text></g></svg>"
      # 8 — pentagone : triangle + trapèze
      - "<svg width='14.4em' height='12em' viewBox='0 0 240 200' xmlns='http://www.w3.org/2000/svg'><g fill='none' stroke-linecap='round' stroke-linejoin='round'><path d='M120 20 L216 88 M216 88 L180 172 M180 172 L60 172 M60 172 L24 88 M24 88 L120 20 M24 88 L216 88' stroke='#118ab2' stroke-width='2'/><path d='M123.4 88 L116.6 84 M123.4 88 L116.6 92 M123.4 172 L116.6 168 M123.4 172 L116.6 176' stroke='#7b2cbf' stroke-width='2'/></g><g fill='#118ab2'><circle cx='120' cy='20' r='2.2'/><circle cx='216' cy='88' r='2.2'/><circle cx='180' cy='172' r='2.2'/><circle cx='60' cy='172' r='2.2'/><circle cx='24' cy='88' r='2.2'/></g><g font-size='14' fill='#118ab2' text-anchor='middle' dominant-baseline='central'><text x='120' y='10'>%0%</text><text x='226' y='86'>%1%</text><text x='187' y='179'>%2%</text><text x='53' y='179'>%3%</text><text x='14' y='86'>%4%</text></g></svg>"
      # 9 — triangle rectangle : trapèze + triangle rectangle
      - "<svg width='14.4em' height='12em' viewBox='0 0 240 200' xmlns='http://www.w3.org/2000/svg'><path d='M20 170 L20 161.6 L28.4 161.6 L28.4 170 Z M138 170 L138 161.6 L146.4 161.6 L146.4 170 Z M138 170 L129.6 170 L129.6 161.6 L138 161.6 Z' fill='#ffd166' fill-opacity='0.7' stroke='none'/><g fill='none' stroke-linecap='round' stroke-linejoin='round'><path d='M20 24 L20 170 M20 170 L224 170 M224 170 L20 24 M138 108.4 L138 170' stroke='#118ab2' stroke-width='2'/><path d='M20 161.6 L28.4 161.6 L28.4 170 M138 161.6 L146.4 161.6 L146.4 170 M129.6 170 L129.6 161.6 L138 161.6' stroke='#c1121f' stroke-width='1.5'/></g><g fill='#118ab2'><circle cx='20' cy='24' r='2.2'/><circle cx='20' cy='170' r='2.2'/><circle cx='224' cy='170' r='2.2'/><circle cx='138' cy='108.4' r='2.2'/><circle cx='138' cy='170' r='2.2'/></g><g font-size='14' fill='#118ab2' text-anchor='middle' dominant-baseline='central'><text x='14' y='16'>%0%</text><text x='12' y='176'>%1%</text><text x='232' y='173'>%2%</text><text x='148' y='106'>%3%</text><text x='145' y='177'>%4%</text></g></svg>"
  polys:
    # option 0 — 1 ou 2 polygones inclus
    -
      # 0 — rectangle : carré + rectangle
      - [{ nat: "rectangle", v: [0, 1, 2, 3], clue: "qui contient les sommets %0% et %1%" }, { nat: "carré", v: [0, 4, 5, 3], clue: "de la figure" }, { nat: "rectangle", v: [4, 1, 2, 5], clue: "qui contient le sommet %1% mais pas le sommet %0%" }]
      # 1 — triangle : triangle rectangle + triangle rectangle
      - [{ nat: "triangle", v: [0, 1, 2], clue: "qui contient les sommets %1% et %2%" }, { nat: "triangle rectangle", v: [0, 1, 3], clue: "dont un sommet est %1%" }, { nat: "triangle rectangle", v: [0, 3, 2], clue: "dont un sommet est %2%" }]
      # 2 — carré : triangle rectangle + triangle rectangle
      - [{ nat: "carré", v: [0, 1, 2, 3], clue: "de la figure" }, { nat: "triangle rectangle", v: [0, 1, 2], clue: "dont un sommet est %1%" }, { nat: "triangle rectangle", v: [0, 2, 3], clue: "dont un sommet est %3%" }]
      # 3 — parallélogramme : triangle + triangle
      - [{ nat: "parallélogramme", v: [0, 1, 2, 3], clue: "de la figure" }, { nat: "triangle", v: [0, 1, 3], clue: "dont un sommet est %0%" }, { nat: "triangle", v: [1, 2, 3], clue: "dont un sommet est %2%" }]
      # 4 — triangle : carré
      - [{ nat: "triangle", v: [0, 1, 2], clue: "qui contient tous les sommets marqués" }, { nat: "carré", v: [3, 4, 5, 6], clue: "de la figure" }]
      # 5 — hexagone : trapèze + trapèze
      - [{ nat: "hexagone", v: [0, 1, 2, 3, 4, 5], clue: "de la figure" }, { nat: "trapèze", v: [0, 1, 2, 3], clue: "dont un sommet est %1%" }, { nat: "trapèze", v: [0, 3, 4, 5], clue: "dont un sommet est %4%" }]
      # 6 — triangle : triangle + trapèze
      - [{ nat: "triangle", v: [0, 1, 2], clue: "qui contient tous les sommets marqués" }, { nat: "triangle", v: [0, 3, 4], clue: "qui ne contient ni le sommet %1% ni le sommet %2%" }, { nat: "trapèze", v: [3, 1, 2, 4], clue: "de la figure" }]
      # 7 — losange : triangle + triangle
      - [{ nat: "losange", v: [0, 1, 2, 3], clue: "de la figure" }, { nat: "triangle", v: [0, 1, 3], clue: "dont un sommet est %0%" }, { nat: "triangle", v: [1, 2, 3], clue: "dont un sommet est %2%" }]
      # 8 — pentagone : triangle + trapèze
      - [{ nat: "pentagone", v: [0, 1, 2, 3, 4], clue: "de la figure" }, { nat: "triangle", v: [0, 1, 2], clue: "de la figure" }, { nat: "trapèze", v: [0, 2, 3, 4], clue: "de la figure" }]
      # 9 — rectangle : carré + carré
      - [{ nat: "rectangle", v: [0, 1, 2, 3], clue: "de la figure" }, { nat: "carré", v: [0, 4, 5, 3], clue: "dont un sommet est %0%" }, { nat: "carré", v: [4, 1, 2, 5], clue: "dont un sommet est %1%" }]
    # option 1 — 2 ou 3 polygones inclus
    -
      # 0 — rectangle : carré + triangle rectangle + triangle rectangle
      - [{ nat: "rectangle", v: [0, 1, 2, 3], clue: "qui contient les sommets %0% et %1%" }, { nat: "carré", v: [0, 4, 5, 3], clue: "de la figure" }, { nat: "triangle rectangle", v: [4, 1, 2], clue: "dont un sommet est %1%" }, { nat: "triangle rectangle", v: [4, 5, 2], clue: "dont un sommet est %5%" }]
      # 1 — trapèze : rectangle + triangle rectangle + triangle rectangle
      - [{ nat: "trapèze", v: [0, 1, 2, 3], clue: "qui contient tous les sommets marqués" }, { nat: "rectangle", v: [0, 4, 5, 1], clue: "de la figure" }, { nat: "triangle rectangle", v: [0, 3, 4], clue: "dont un sommet est %3%" }, { nat: "triangle rectangle", v: [1, 5, 2], clue: "dont un sommet est %2%" }]
      # 2 — hexagone : trapèze + triangle + triangle
      - [{ nat: "hexagone", v: [0, 1, 2, 3, 4, 5], clue: "de la figure" }, { nat: "trapèze", v: [5, 2, 3, 4], clue: "de la figure" }, { nat: "triangle", v: [5, 0, 1], clue: "qui contient le sommet %0%" }, { nat: "triangle", v: [5, 1, 2], clue: "qui ne contient pas le sommet %0%" }]
      # 3 — rectangle : triangle + triangle rectangle + triangle rectangle
      - [{ nat: "rectangle", v: [0, 1, 2, 3], clue: "de la figure" }, { nat: "triangle", v: [4, 3, 2], clue: "qui contient les sommets %3% et %2%" }, { nat: "triangle rectangle", v: [0, 3, 4], clue: "dont un sommet est %0%" }, { nat: "triangle rectangle", v: [4, 1, 2], clue: "dont un sommet est %1%" }]
      # 4 — pentagone : triangle + triangle + triangle
      - [{ nat: "pentagone", v: [0, 1, 2, 3, 4], clue: "de la figure" }, { nat: "triangle", v: [0, 1, 2], clue: "qui contient le sommet %1%" }, { nat: "triangle", v: [0, 2, 3], clue: "qui ne contient ni le sommet %1% ni le sommet %4%" }, { nat: "triangle", v: [0, 3, 4], clue: "qui contient le sommet %4%" }]
      # 5 — triangle : triangle + trapèze + trapèze
      - [{ nat: "triangle", v: [0, 1, 2], clue: "qui contient tous les sommets marqués" }, { nat: "triangle", v: [0, 3, 4], clue: "qui ne contient ni le sommet %1% ni le sommet %2%" }, { nat: "trapèze", v: [3, 4, 6, 5], clue: "qui contient les sommets %3% et %4%" }, { nat: "trapèze", v: [5, 6, 2, 1], clue: "qui contient les sommets %1% et %2%" }]
      # 6 — rectangle : carré + rectangle + rectangle
      - [{ nat: "rectangle", v: [0, 1, 2, 3], clue: "qui contient tous les sommets marqués" }, { nat: "carré", v: [4, 5, 6, 7], clue: "de la figure" }, { nat: "rectangle", v: [0, 4, 7, 3], clue: "dont un sommet est %0%" }, { nat: "rectangle", v: [5, 1, 2, 6], clue: "dont un sommet est %1%" }]
      # 7 — trapèze : triangle + triangle
      - [{ nat: "trapèze", v: [0, 1, 2, 3], clue: "de la figure" }, { nat: "triangle", v: [0, 1, 2], clue: "qui contient le sommet %1%" }, { nat: "triangle", v: [0, 2, 3], clue: "qui contient le sommet %3%" }]
      # 8 — pentagone : triangle + trapèze
      - [{ nat: "pentagone", v: [0, 1, 2, 3, 4], clue: "de la figure" }, { nat: "triangle", v: [0, 1, 4], clue: "de la figure" }, { nat: "trapèze", v: [4, 1, 2, 3], clue: "de la figure" }]
      # 9 — triangle rectangle : trapèze + triangle rectangle
      - [{ nat: "triangle rectangle", v: [0, 1, 2], clue: "qui contient le sommet %0%" }, { nat: "trapèze", v: [0, 1, 4, 3], clue: "de la figure" }, { nat: "triangle rectangle", v: [3, 4, 2], clue: "qui ne contient pas le sommet %0%" }]
vars:
  # option 0 : 1 ou 2 figures incluses ; option 1 : 2 ou 3
  opt: 0
  numfig: "0_9"
  npoly: ${:polys[:opt][:numfig].length}
  # nombre de sommets du tracé, puis lettres consécutives de pool au hasard
  nl: ${:polys[:opt][:numfig].reduce(function(a,p){return a+p.v.length},0)}
  lp: "0_${:pool.length-:nl}"
  # ─── polygone interrogé : n'importe lequel du tracé, la principale comprise
  tgt: "0_${:npoly-1}"
  tNat: ${:polys[:opt][:numfig][:tgt].nat}
  tNatSA: ${:sansAccent[:tNat]}
  tNom: ${:tNat==='hexagone'?"l'hexagone":'le '+:tNat}
  tL: ${:polys[:opt][:numfig][:tgt].v.map(function(i){return :pool[:lp+i]}).join('')}
  # désignation qui distingue le polygone quand un autre a la même nature :
  # « de la figure », « dont un sommet est A », « qui contient le sommet B
  # mais pas le sommet A »… — les lettres y remplacent les marques %i%
  tClue: ${:polys[:opt][:numfig][:tgt].clue.split('%').map(function(t){return t!==''&&t.length<3&&!isNaN(t)?:pool[:lp+Number(t)]:t}).join('')}
  lecture: ${:lect[:tNat]}
  # ─── le tracé, où l'on écrit les lettres tirées à la place des marques %i% :
  # découpé sur les %, un morceau purement numérique est une marque
  fig: ${:figs[:opt][:numfig].split('%').map(function(t){return t!==''&&t.length<3&&!isNaN(t)?:pool[:lp+Number(t)]:t}).join('')}
question: "Nomme :tNom :tClue."
shortq: "nomme :tNom ?"
answer: "C'est le polygone <span class='red'>$$:tL$$</span>.<br>:lecture"
# toutes les façons de nommer le polygone : chaque sommet de départ, dans les
# deux sens de parcours — douze écritures pour un hexagone, avec répétitions
# pour les polygones plus petits
value:
  - "${(function(){var L=:tL,n=L.length,k=0%(2*n),s='',i;if(k<n){for(i=0;i<n;i++){s+=L[(k+i)%n]}}else{k=k-n;for(i=0;i<n;i++){s+=L[(k+n-i)%n]}}return s})()}"
  - "${(function(){var L=:tL,n=L.length,k=1%(2*n),s='',i;if(k<n){for(i=0;i<n;i++){s+=L[(k+i)%n]}}else{k=k-n;for(i=0;i<n;i++){s+=L[(k+n-i)%n]}}return s})()}"
  - "${(function(){var L=:tL,n=L.length,k=2%(2*n),s='',i;if(k<n){for(i=0;i<n;i++){s+=L[(k+i)%n]}}else{k=k-n;for(i=0;i<n;i++){s+=L[(k+n-i)%n]}}return s})()}"
  - "${(function(){var L=:tL,n=L.length,k=3%(2*n),s='',i;if(k<n){for(i=0;i<n;i++){s+=L[(k+i)%n]}}else{k=k-n;for(i=0;i<n;i++){s+=L[(k+n-i)%n]}}return s})()}"
  - "${(function(){var L=:tL,n=L.length,k=4%(2*n),s='',i;if(k<n){for(i=0;i<n;i++){s+=L[(k+i)%n]}}else{k=k-n;for(i=0;i<n;i++){s+=L[(k+n-i)%n]}}return s})()}"
  - "${(function(){var L=:tL,n=L.length,k=5%(2*n),s='',i;if(k<n){for(i=0;i<n;i++){s+=L[(k+i)%n]}}else{k=k-n;for(i=0;i<n;i++){s+=L[(k+n-i)%n]}}return s})()}"
  - "${(function(){var L=:tL,n=L.length,k=6%(2*n),s='',i;if(k<n){for(i=0;i<n;i++){s+=L[(k+i)%n]}}else{k=k-n;for(i=0;i<n;i++){s+=L[(k+n-i)%n]}}return s})()}"
  - "${(function(){var L=:tL,n=L.length,k=7%(2*n),s='',i;if(k<n){for(i=0;i<n;i++){s+=L[(k+i)%n]}}else{k=k-n;for(i=0;i<n;i++){s+=L[(k+n-i)%n]}}return s})()}"
  - "${(function(){var L=:tL,n=L.length,k=8%(2*n),s='',i;if(k<n){for(i=0;i<n;i++){s+=L[(k+i)%n]}}else{k=k-n;for(i=0;i<n;i++){s+=L[(k+n-i)%n]}}return s})()}"
  - "${(function(){var L=:tL,n=L.length,k=9%(2*n),s='',i;if(k<n){for(i=0;i<n;i++){s+=L[(k+i)%n]}}else{k=k-n;for(i=0;i<n;i++){s+=L[(k+n-i)%n]}}return s})()}"
  - "${(function(){var L=:tL,n=L.length,k=10%(2*n),s='',i;if(k<n){for(i=0;i<n;i++){s+=L[(k+i)%n]}}else{k=k-n;for(i=0;i<n;i++){s+=L[(k+n-i)%n]}}return s})()}"
  - "${(function(){var L=:tL,n=L.length,k=11%(2*n),s='',i;if(k<n){for(i=0;i<n;i++){s+=L[(k+i)%n]}}else{k=k-n;for(i=0;i<n;i++){s+=L[(k+n-i)%n]}}return s})()}"
figure:
  type: svg
  content: ${:fig}
options:
  - name: Nommer un polygone — 1 ou 2 figures incluses
    vars:
      opt: 0
  - name: Nommer un polygone — 2 ou 3 figures incluses
    vars:
      opt: 1
  - name: Nature d'un polygone — 1 ou 2 figures incluses
    consigne: Donner la nature du polygone d'après son codage, sans mesurer.
    vars:
      opt: 0
    question: "Quelle est la nature du polygone $$:tL$$ ?"
    shortq: "nature de $$:tL$$ ?"
    answer: "$$:tL$$ est un <span class='red'>:tNat</span>.<br>:lecture"
    value: [":tNat", ":tNatSA"]
  - name: Nature d'un polygone — 2 ou 3 figures incluses
    consigne: Donner la nature du polygone d'après son codage, sans mesurer.
    vars:
      opt: 1
    question: "Quelle est la nature du polygone $$:tL$$ ?"
    shortq: "nature de $$:tL$$ ?"
    answer: "$$:tL$$ est un <span class='red'>:tNat</span>.<br>:lecture"
    value: [":tNat", ":tNatSA"]
