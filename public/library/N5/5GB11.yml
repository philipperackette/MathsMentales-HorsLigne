title: Nommer un polygone dans une figure complexe
# ───────────────────────────────────────────────────────────────────────────────
# Une figure complexe est présentée (composée de plusieurs polygones imbriqués),
# avec des sommets nommmés par des lettres. L'élève doit identifier un polygone parmi ceux de la figure, soit en donnant son nom (la liste de ses sommets dans l'ordre), soit en donnant sa nature (triangle, carré, rectangle, trapèze, parallélogramme, losange, etc.).
description: "Une figure principale est partagée en polygones à côtés communs ; le codage donne la nature de chacun. Non adapté au mode interactif (online/duel)."
ID: 5GB11
type: text
textSize: medium
dest:
  - 5GB
  - 4GB
consigne: La figure principale est partagée en polygones qui ont des côtés communs. Nommer le polygone demandé par ses sommets, dans l'ordre où ils se suivent.
consts:
  # lettres des sommets. Ni I ni O (confusion avec 1 et 0), ni X, Y, Z (réservés
  # aux axes et aux inconnues).
  pool: "ABCDEFGHJKLMNPQRSTUVW"
  # même nature sans accent : les deux écritures sont acceptées en réponse
  sansAccent:
    triangle: triangle
    triangle rectangle: triangle rectangle
    carré: carre
    rectangle: rectangle
    losange: losange
    parallélogramme: parallelogramme
    trapèze: trapeze
    pentagone: pentagone
    hexagone: hexagone
  # comment la nature se lit sur la figure, rappelé dans la correction
  lect:
    triangle: C'est un polygone à trois côtés.
    triangle rectangle: C'est un triangle dont un angle est droit, marqué sur la figure.
    carré: Ses quatre côtés sont marqués de même longueur et ses angles sont droits.
    rectangle: Ses quatre angles sont droits.
    losange: Ses quatre côtés sont marqués de même longueur.
    parallélogramme: Ses côtés opposés sont parallèles, marqués par les chevrons.
    trapèze: Deux de ses côtés sont parallèles, marqués par les chevrons.
    pentagone: C'est un polygone à cinq côtés.
    hexagone: C'est un polygone à six côtés.
  # ─── figures : dix tracés par option, produits par tools/figures-5GB11.mjs
  # plutôt que construits par JSXGraph. Chaque tracé est une figure principale
  # partagée par un ou plusieurs segments : les polygones ont des côtés communs
  # entre eux et avec la figure principale — un ou deux polygones inclus
  # (option 0), deux ou trois (option 1). Tracé exact, sans mesure : la nature
  # des quadrilatères particuliers se lit sur le codage (traits d'égale
  # longueur, angles droits, chevrons de parallélisme), celle des autres
  # polygones au nombre de côtés.
  #
  # Quand deux polygones d'un tracé ont la même nature (les deux triangles
  # rectangles d'un carré coupé par sa diagonale…), chacun porte une
  # désignation (clue) qui le distingue : « dont un sommet est %i% », « qui
  # contient le sommet %i% mais pas le sommet %j% »… — sinon « de la figure ».
  #
  # Les noms des sommets sont laissés en marques %0%, %1%…, remplacées à la
  # génération : les figures sont des constantes, que la substitution de
  # variables ne traverse pas.
  #
  # figs[option][numéro] ; polys[option][numéro] décrit les polygones du tracé,
  # figure principale d'abord : nature, indices des sommets dans l'ordre du
  # tour de la figure (indices des marques %i%), et désignation.
  figs:
    # option 0 — 1 ou 2 polygones inclus
    -
      # 0 — rectangle : carré + rectangle
