    question: Quel solide est représenté en perspective cavalière ?
    shortq: Quel solide ?
    figure:
      type: svg
      content: ${:fig}
    answer: C'est <span class="red">${:rep}</span>.
    value: ${:rep}
  - name: Pyramide ou cône
    vars:
