title: Aires de parallélogrammes et de figures composées
description: >
  Lire les informations de la figure pour calculer.
ID: 5MA5
type: text
textSize: small
speech: 1
consigne: Lire les longueurs utiles sur la figure.
keys:
  - mm
  - cm
  - dm
  - mt
  - dam
  - hm
  - km
  - x²
dest:
  - 5MA
  - 4MA
  - 3MA
consts:
  unites: [mm, cm, dm, m, dam, hm, km]
  uv:
    mm: millimètres
    cm: centimètres
    dm: décimètres
    m: mètres
    dam: décamètres
    hm: hectomètres
    km: kilomètres
  # ─── figures : quatre tracés par option, dessinés d’avance plutôt que
  # construits à la volée par JSXGraph, dans le style de 6MC1 (trait noir fin
  # dans un cadre de 79,35 x 47,7, hauteurs en pointillés, marque d’angle
  # droit). Elles sont produites par tools/figures-5MA5.mjs.
  #
  # Comme dans 6MC1, le dessin ne respecte pas les mesures tirées : les
  # longueurs ne sont que des étiquettes posées sur une forme figée. Ces
  # étiquettes restent en marques %B% (base ou côté), %C% (côté oblique),
  # %H% (hauteur), %L% et %W% (côtés du rectangle), %P% (hauteur du
  # parallélogramme), %T% (hauteur du triangle), remplacées à la génération :
  # les figures sont des constantes, et la substitution de variables ne les
  # traverse pas au bon moment.
  paraPoses:
    - "<svg width='15em' height='9em' viewBox='0 0 79.35 47.7' xmlns='http://www.w3.org/2000/svg'><path d='M0.6 37.15L60.04 37.15L78.75 1.93L19.31 1.93Z' fill='none' stroke='#000' stroke-width='.49' stroke-linecap='round' stroke-linejoin='round'/><path d='M19.31 1.93L19.31 37.15' fill='none' stroke='#000' stroke-width='.49' stroke-linecap='round' stroke-dasharray='1.6 1.2'/><path d='M19.31 37.15L21.61 37.15L21.61 34.85L19.31 34.85Z' fill='#fff' stroke='#000' stroke-width='.4' stroke-linejoin='round'/><text x='20.71' y='21.58' font-family='Arial' font-size='6' text-anchor='start' stroke-width='.265'>%H%</text><text x='30.32' y='44.27' font-family='Arial' font-size='6' text-anchor='middle' stroke-width='.265'>%B%</text></svg>"
