options:
  - name: Aire d’un parallélogramme
    vars:
      b: "2_12"
      h: "2_9"
      u: "0_6"
      aire: "${:b*:h}"
      lb: "${:b} ${:unites[:u]}"
      lh: "${:h} ${:unites[:u]}"
      numfig: "0_3"
      fig: "${:paraPoses[:numfig].replaceAll('%B%',:lb).replaceAll('%H%',:lh)}"
    figure:
      type: svg
      content: "${:fig}"
    question: 'Quelle est l’<b>aire</b> de ce parallélogramme de base $$${:b}\text{ ${:unites[:u]}}$$ et de hauteur $$${:h}\text{ ${:unites[:u]}}$$ ?'
    shortq: 'Aire du parallélogramme ?'
    audio: 'Quelle est l’aire d’un parallélogramme de base ${:b} ${:uv[:unites[:u]]} et de hauteur ${:h} ${:uv[:unites[:u]]} ?'
    answer: '$$b\times h=${:b}\times${:h}=\color{red}{${:aire}\text{ ${:unites[:u]}}^2}$$'
    value:
      - "${:aire}~${:unites[:u]}^2"
      - "${:aire}${:unites[:u]}^2"
      - "${:aire}"
  - name: Aire d’un parallélogramme, hauteur relative à un côté
    vars:
      c: "2_12"
      h: "2_9"
      u: "0_6"
      aire: "${:c*:h}"
      lc: "${:c} ${:unites[:u]}"
      lh: "${:h} ${:unites[:u]}"
      numfig: "0_3"
      fig: "${:paraBiais[:numfig].replaceAll('%C%',:lc).replaceAll('%H%',:lh)}"
    figure:
      type: svg
      content: "${:fig}"
    question: 'Quelle est l’<b>aire</b> de ce parallélogramme de côté $$${:c}\text{ ${:unites[:u]}}$$ et de hauteur relative à ce côté $$${:h}\text{ ${:unites[:u]}}$$ ?'
    shortq: 'Aire du parallélogramme ?'
    audio: 'Quelle est l’aire d’un parallélogramme de côté ${:c} ${:uv[:unites[:u]]} et de hauteur relative à ce côté ${:h} ${:uv[:unites[:u]]} ?'
    answer: '$$c\times h=${:c}\times${:h}=\color{red}{${:aire}\text{ ${:unites[:u]}}^2}$$'
    value:
      - "${:aire}~${:unites[:u]}^2"
      - "${:aire}${:unites[:u]}^2"
      - "${:aire}"
  - name: Aire d’un parallélogramme non posé
    vars:
      b: "2_12"
      h: "2_9"
      u: "0_6"
      aire: "${:b*:h}"
      lb: "${:b} ${:unites[:u]}"
      lh: "${:h} ${:unites[:u]}"
      numfig: "0_3"
      fig: "${:paraTournes[:numfig].replaceAll('%B%',:lb).replaceAll('%H%',:lh)}"
    figure:
      type: svg
      content: "${:fig}"
    question: 'Quelle est l’<b>aire</b> de ce parallélogramme de côté $$${:b}\text{ ${:unites[:u]}}$$ et de hauteur associée $$${:h}\text{ ${:unites[:u]}}$$ ?'
    shortq: 'Aire du parallélogramme ?'
    audio: 'Quelle est l’aire d’un parallélogramme de côté ${:b} ${:uv[:unites[:u]]} et de hauteur associée ${:h} ${:uv[:unites[:u]]} ?'
    answer: '$$b\times h=${:b}\times${:h}=\color{red}{${:aire}\text{ ${:unites[:u]}}^2}$$'
    value:
      - "${:aire}~${:unites[:u]}^2"
      - "${:aire}${:unites[:u]}^2"
      - "${:aire}"
  - name: Aire d’un rectangle et d’un triangle
    # la longueur du rectangle est paire : l’aire du triangle qui s’appuie
    # dessus reste entière, et le calcul se fait de tête
    vars:
      k: "2_5"
      lo: "${:k*2}"
      # l’autre côté du rectangle évite la longueur du premier : un rectangle
      # aux deux côtés égaux serait un carré, et l’énoncé le dirait mal
      la: "2_8_^${:lo}"
      ht: "2_6"
      u: "0_6"
      aireR: "${:lo*:la}"
      aireT: "${:k*:ht}"
      aire: "${:aireR+:aireT}"
      llo: "${:lo} ${:unites[:u]}"
      lla: "${:la} ${:unites[:u]}"
      lht: "${:ht} ${:unites[:u]}"
      numfig: "0_3"
      fig: "${:rectTriangles[:numfig].replaceAll('%L%',:llo).replaceAll('%W%',:lla).replaceAll('%T%',:lht)}"
    figure:
      type: svg
      content: "${:fig}"
    question: 'Quelle est l’<b>aire</b> de cette figure, formée d’un rectangle de côtés $$${:lo}\text{ ${:unites[:u]}}$$ et $$${:la}\text{ ${:unites[:u]}}$$ et d’un triangle de base $$${:lo}\text{ ${:unites[:u]}}$$ et de hauteur $$${:ht}\text{ ${:unites[:u]}}$$ ?'
    shortq: 'Aire de la figure ?'
    audio: 'Quelle est l’aire d’une figure formée d’un rectangle de côtés ${:lo} et ${:la} ${:uv[:unites[:u]]} et d’un triangle de base ${:lo} et de hauteur ${:ht} ${:uv[:unites[:u]]} ?'
    answer: '$$${:lo}\times${:la}+\dfrac{${:lo}\times${:ht}}{2}=${:aireR}+${:aireT}=\color{red}{${:aire}\text{ ${:unites[:u]}}^2}$$'
    value:
      - "${:aire}~${:unites[:u]}^2"
      - "${:aire}${:unites[:u]}^2"
      - "${:aire}"
  - name: Aire d’un parallélogramme et d’un triangle
