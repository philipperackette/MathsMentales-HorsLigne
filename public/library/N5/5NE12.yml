title: "Suites de motifs : décrire et continuer une progression"
dest:
  - 5NE
  - 4NE
  - 3ND
type: text
textSize: medium
# chaque figure n'est utile qu'une fois : au-delà, les questions se répètent
# à l'identique (mêmes type/numfig), seule la fenêtre de dédoublonnage change.
repeat: 1
description: "À partir de 3 étapes d'une suite de motifs (inspirée de visualpatterns.org), dessiner l'étape suivante ou calculer le nombre de motifs à une étape donnée. Les suites sont regroupées par type de progression : linéaire, affine, autre. Options « dessiner l'étape suivante » non adaptées au mode interactif (online/duel)."
consts:
  # figsQ[type][numfig] : étapes 1 à 3, la figure de l'énoncé, commune aux
  # trois options d'un même type. figsC[type][numfig] : étapes 1 à 4, la 4e
  # encadrée en pointillés (corrigé de « dessiner l'étape suivante »).
  #
  # type : 0 linéaire (a×n), 1 affine (a×n+b), 2 autre (carré n² ou escalier
  # n(n+1)/2, ce dernier redessiné une fois en cubes isométriques).
