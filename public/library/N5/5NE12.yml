  # ─── textes d'explication et formules, avec des marques %A% %B% %N%
  # remplacées à la génération (une variable ne traverse pas les constantes)
  texteLineaire: "à chaque étape, on ajoute toujours %A% motif(s) : c’est une progression <strong>linéaire</strong> (proportionnelle au numéro de l’étape)."
  texteAffine: "à chaque étape, on ajoute toujours %A% motif(s), mais il y a %B% motif(s) de plus dès le départ : c’est une progression <strong>affine</strong>, pas linéaire."
  texteAutre:
    - "Les motifs forment un carré, dont le côté a autant de motifs que le numéro de l’étape."
    - "C’est la somme des premiers entiers, jusqu’au numéro de l’étape."
  formuleLineaire: '%A%\times %N%'
  formuleAffine: '%A%\times %N%+%B%'
  formuleAutre:
    - '%N%\times %N%'
    - '1+2+\ldots+%N%'
vars:
  # type et numfig : fixés par chaque option pour le type, mélangé pour la variante
  type: 0
  numfig: "0_7"
  a: ${:mA[:type][:numfig]}
  b: ${:mB[:type][:numfig]}
  count4: ${:mCount4[:type][:numfig]}
  count10: ${:mCount10[:type][:numfig]}
  nature: ${:type===2?:mNature[2][:numfig]:0}
  texte: ${(:type===0?:texteLineaire:(:type===1?:texteAffine::texteAutre[:nature])).replaceAll('%A%',:a).replaceAll('%B%',:b)}
  formule: ${(:type===0?:formuleLineaire:(:type===1?:formuleAffine::formuleAutre[:nature])).replaceAll('%A%',:a).replaceAll('%B%',:b)}
  # formule avec %N% déjà remplacé : le champ answer ne doit contenir que des
  # :variable nues, jamais de ${…} — un texte français mêlé d'apostrophes
  # (l'étape, n'est) avant un ${…} dérègle le compteur de guillemets de
  # convertToPointVar() et bloque la suite de la substitution (cf. utils.js).
  formule4: ${:formule.replaceAll('%N%','4')}
  formule10: ${:formule.replaceAll('%N%','10')}
  fig: ${:figsQ[:type][:numfig]}
  figC: ${:figsC[:type][:numfig]}
figure:
  type: svg
  content: ${:fig}
options:
  - name: "Linéaire — dessiner l'étape suivante"
    vars:
      type: 0
    question: >
      Voici les 3 premières étapes d'une suite de motifs.<br>
      Dessine l'étape suivante (étape 4).
    answer: >
      Ici, :texte<br>
      À l'étape 4, il y a $$:formule4=:count4$$ motifs, disposés comme ci-dessous.
    value: ""
    figureCorrection:
      type: svg
      content: ${:figC}
  - name: "Linéaire — combien de motifs à l'étape 4 ?"
    vars:
      type: 0
    question: >
      Voici les 3 premières étapes d'une suite de motifs.<br>
      Combien y a-t-il de motifs à l'étape 4 ?
    answer: >
      Ici, :texte<br>
      À l'étape 4, il y a $$:formule4=\color{red}{:count4}$$ motifs.
    value: :count4
  - name: "Linéaire — combien de motifs à l'étape 10 ?"
    vars:
      type: 0
    question: >
      Voici les 3 premières étapes d'une suite de motifs.<br>
      Combien y a-t-il de motifs à l'étape 10 ?
    answer: >
      Ici, :texte<br>
      À l'étape 10, il y a $$:formule10=\color{red}{:count10}$$ motifs.
    value: :count10
  - name: "Linéaire — les 3 questions à la fois"
    vars:
      type: 0
    question: >
      Voici les 3 premières étapes d'une suite de motifs.<br>
      a) Dessine l'étape suivante (étape 4).<br>
      b) Combien y a-t-il de motifs à l'étape 4 ?<br>
      c) Combien y a-t-il de motifs à l'étape 10 ?
    answer: >
      Ici, :texte<br>
      a) Voir la figure ci-dessous.<br>
      b) À l'étape 4, il y a $$:formule4=\color{red}{:count4}$$ motifs.<br>
      c) À l'étape 10, il y a $$:formule10=\color{red}{:count10}$$ motifs.
    value: ""
    figureCorrection:
      type: svg
      content: ${:figC}
  - name: "Affine — dessiner l'étape suivante"
    vars:
