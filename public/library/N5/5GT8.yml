vars:
  # ─── valeurs par défaut, écrasées par chaque option : elles sont déclarées
  # ici pour que l’ordre de résolution les place avant leur première
  # utilisation — Object.assign n’ajoute en fin de liste que les clés absentes.
  vidx: "0_23"
  guide: 0
  nc: 5
  nr: 5
  cell: 2.4
  # ─── déplacement de A vers B, tiré parmi vecs selon le palier
  vx: ${:vecs[:vidx][0]}
  vy: ${:vecs[:vidx][1]}
  mdx: ${Math.abs(:vx)}
  mdy: ${Math.abs(:vy)}
  # ─── colonne et ligne de B (repère 0 = colonne de gauche, ligne du haut).
  # La marge mdx/mdy laissée sur les bords garantit que A, placé à l’opposé de
  # B, et le symétrique cherché, placé au delà, tombent tous deux dans le plan.
  bcol: "${:mdx}_${:nc-1-:mdx}"
  brow: "${:mdy}_${:nr-1-:mdy}"
  acol: ${:bcol-:vx}
  arow: ${:brow-:vy}
  # ─── symétrique de A par rapport à B : B prolonge le trajet d’autant au-delà
  tcol: ${:bcol+:vx}
  trow: ${:brow+:vy}
  zoneT: ${:trow*:nc+:tcol+1}
  # ─── coordonnées du dessin. Le numéro occupe le haut de la zone : A et B
  # sont posés un peu plus bas que le centre, et leur lettre à côté d’eux, pour
  # que rien ne se recouvre. Le même écart s’applique aux deux points et à leur
  # symétrique : B reste donc le milieu de A et de son image, et la figure dit
  # exactement ce que dit le calcul.
  ax: ${MMmath.round((:acol+0.5-0.16)*:cell,3)}
  ay: ${MMmath.round((:nr-0.5-:arow-0.17)*:cell,3)}
  bx: ${MMmath.round((:bcol+0.5-0.16)*:cell,3)}
  by: ${MMmath.round((:nr-0.5-:brow-0.17)*:cell,3)}
  alx: ${MMmath.round((:acol+0.5+0.19)*:cell,3)}
  aly: ${MMmath.round((:nr-0.5-:arow-0.17)*:cell,3)}
  blx: ${MMmath.round((:bcol+0.5+0.19)*:cell,3)}
  bly: ${MMmath.round((:nr-0.5-:brow-0.17)*:cell,3)}
question: "Sur la figure, A et B sont deux points placés dans des zones numérotées.<br>Dans quelle zone se trouve le symétrique du point A par rapport au point B ?"
shortq: "symétrique de A par rapport à B : quelle zone ?"
answer: "Le symétrique de A par rapport à B tombe dans la zone <span class='red'>:zoneT</span>.<br>B est le milieu du segment reliant A à son symétrique : en repartant de B, on prolonge le trajet de A vers B d’autant, dans la même direction."
value: ":zoneT"
