title: Lire l’abscisse sur une droite graduée
description: Point sur axe gradué, abscisse relative
dest:
  - 5NA
  - 4NA
  - 3NA
type: text
consts:
  nomspts: "ABCDEFGHJKLMNPQRSTVW"
options:
  - name: Lire des entiers successifs
    vars:
      absc: "-50_20"
      ptid: "0_${:nomspts.length-1}"
      pt: ${:nomspts[:ptid]}
      ticksperlabel: "2_5"
      index: ${Math.floor((:absc*2-10)/20)}
      borneinf: ${:index*20+10-1}
      bornesup: ${:borneinf+22}
    figure:
      type: graph
      boundingbox: ["${:borneinf}", 2, "${:bornesup}", -2]
      axis: false
      grid: false
      content:
        - [
            line,
            [[0, 0], [1, 0]],
            { name: l1, lastArrow: { type: 1, size: 5 } },
          ]
        - [
            ticks,
            [l1],
            {
              minorTicks: 0,
              anchor: left,
              drawLabels: true,
              scale: 2,
              majorHeight: 10,
              ticksPerLabel: :ticksperlabel,
              drawZero: true,
              label: { anchorX: middle, offset: [0, -12] },
            },
          ]
        - [
            point,
            ["${:absc*2}", 0],
            {
              name: :pt,
              visible: true,
              face: x,
              label: { offset: [0, 13], anchorX: middle },
            },
          ]
  - name: Lire des entiers entre deux dizaines consécutives
    vars:
      dizaine: "-5_1"
      borneinf: ${:dizaine*10}
      bornesup: ${:borneinf+10}
      k: "1_9"
      absc: ${:borneinf+:k}
      ptid: "0_${:nomspts.length-1}"
      pt: ${:nomspts[:ptid]}
      positionPtSurAxe: ${MMmath.round(2+1.8*:k,3)}
    figure:
      type: graph
      boundingbox: [0, 2, 22, -2]
      axis: false
      grid: false
      content:
        - [
            line,
            [[0, 0], [1, 0]],
            { name: l1, lastArrow: { type: 1, size: 5 } },
          ]
        - [
            ticks,
            [
              l1,
              [3.8, 5.6, 7.4, 9.2, 11, 12.8, 14.6, 16.4, 18.2],
            ],
            { minorTicks: 0, drawLabels: false, majorHeight: 8 },
          ]
        - [
            ticks,
            [l1, [2, 20]],
            {
              minorTicks: 0,
              drawLabels: true,
              majorHeight: 16,
              label: { anchorX: middle, offset: [0, -13] },
              labels: ["${:borneinf}", "${:bornesup}"],
            },
          ]
        - [
            point,
            [:positionPtSurAxe, 0],
            {
              name: :pt,
              visible: true,
              face: x,
              label: { offset: [0, 13], anchorX: middle },
            },
          ]
  - name: Lire des entiers, écart entre graduations variable
    vars:
      nbgrad: [6, 7, 8, 9, 10]
      ecart: ${MMmath.round(22/(:nbgrad+1),3)}
      ticksperlabel: "2_3"
      pas: [1, 2, 5, 10]
      minmax: "-${Math.floor(50/:pas)}_${Math.floor(20/:pas)}"
      absc: ${:minmax*:pas}
      ptid: "0_${:nomspts.length-1}"
      pt: ${:nomspts[:ptid]}
      positionSurTicks: ${MMmath.aleaInt(1,:nbgrad)}
      offsetlbl: ${(:positionSurTicks+MMmath.aleaInt(1,:ticksperlabel-1))%:ticksperlabel}
      positionPtSurAxe: ${MMmath.round(:ecart*:positionSurTicks,3)}
      borneinf: ${:absc-(:positionSurTicks-1)*:pas}
    figure:
      type: graph
      boundingbox: [0, 2, 22, -2]
      axis: false
      grid: false
      content:
        - [
            line,
            [[0, 0], [1, 0]],
            { name: l1, lastArrow: { type: 1, size: 5 } },
          ]
        - [
            ticks,
            [
              l1,
              [
                "${MMmath.round(:ecart*1,3)}",
                "${MMmath.round(:ecart*2,3)}",
                "${MMmath.round(:ecart*3,3)}",
                "${MMmath.round(:ecart*4,3)}",
                "${MMmath.round(:ecart*5,3)}",
                "${MMmath.round(:ecart*6,3)}",
                "${7<=:nbgrad?MMmath.round(:ecart*7,3):-5}",
                "${8<=:nbgrad?MMmath.round(:ecart*8,3):-5}",
                "${9<=:nbgrad?MMmath.round(:ecart*9,3):-5}",
                "${10<=:nbgrad?MMmath.round(:ecart*10,3):-5}",
              ],
            ],
            {
              minorTicks: 0,
              drawLabels: true,
              majorHeight: 10,
              drawZero: true,
              label: { anchorX: middle, offset: [0, -12] },
              labels:
                [
                  "${1%:ticksperlabel===:offsetlbl?:borneinf:''}",
                  "${2%:ticksperlabel===:offsetlbl?:borneinf+:pas:''}",
                  "${3%:ticksperlabel===:offsetlbl?:borneinf+:pas*2:''}",
                  "${4%:ticksperlabel===:offsetlbl?:borneinf+:pas*3:''}",
                  "${5%:ticksperlabel===:offsetlbl?:borneinf+:pas*4:''}",
                  "${6%:ticksperlabel===:offsetlbl?:borneinf+:pas*5:''}",
                  "${7%:ticksperlabel===:offsetlbl?:borneinf+:pas*6:''}",
                  "${8%:ticksperlabel===:offsetlbl?:borneinf+:pas*7:''}",
                  "${9%:ticksperlabel===:offsetlbl?:borneinf+:pas*8:''}",
                  "${10%:ticksperlabel===:offsetlbl?:borneinf+:pas*9:''}",
                ],
            },
          ]
        - [
            point,
            [:positionPtSurAxe, 0],
            {
              name: :pt,
              visible: true,
              face: x,
              label: { offset: [0, 13], anchorX: middle },
            },
          ]
  - name: Lire des décimaux
    vars:
      pas: 0.1
      minmax: "-${Math.floor(50/:pas)}_${Math.floor(20/:pas)}"
      absc: ${MMmath.round(:minmax*:pas,1)}
      indexSurAxe: "1_23"
      ptid: "0_${:nomspts.length-1}"
