      lb1: ${:borneinf}
      lb2: ${MMmath.round(:borneinf+:pas,1)}
      lb3: ${MMmath.round(:borneinf+:pas*2,1)}
      lb4: ${MMmath.round(:borneinf+:pas*3,1)}
      lb5: ${MMmath.round(:borneinf+:pas*4,1)}
      lb6: ${MMmath.round(:borneinf+:pas*5,1)}
      lb7: ${MMmath.round(:borneinf+:pas*6,1)}
      lb8: ${MMmath.round(:borneinf+:pas*7,1)}
